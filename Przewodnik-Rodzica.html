<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Przewodnik Rodzica · demo (dane fikcyjne)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&amp;display=swap">
<style>
/* Przewodnik Rodzica · arkusz strony: tokeny (design/tokeny.md §9) + receptury components/bundle.css + komponenty strony + restyling */
/* Reset: wszystkie wymiary systemu zakładają border-box  [wykryte] */
*, *::before, *::after { box-sizing: border-box; }

:root {
  /* Powierzchnie */
  --color-surface-page: #ffffff;                       /* [wykryte] */
  --color-surface-subtle: #f7f7f7;                     /* [wykryte] */
  --color-surface-info: #ddf4ff;                       /* [wykryte] */
  --color-surface-brand: #58cc02;                      /* [wykryte] */
  --color-surface-inverse: #100f3e;                    /* [wykryte] */
  --color-surface-overlay: rgba(0, 0, 0, 0.3);         /* [wykryte] */
  --color-surface-overlay-strong: rgba(0, 0, 0, 0.4);  /* [wykryte] */
  --color-surface-disabled: #e5e5e5;                   /* [wywnioskowane, do weryfikacji] */

  /* Ramki */
  --color-border-default: #e5e5e5;                     /* [wykryte] */
  --color-border-field: #777777;                       /* [wywnioskowane AA, do weryfikacji] */
  --color-border-focus: #2b70c9;                       /* [wywnioskowane AA] */
  --color-border-error: #ea2b2b;                       /* [wywnioskowane, do weryfikacji] */

  /* Tekst */
  --color-text-strong: #3c3c3c;                        /* [wykryte] */
  --color-text-primary: #4b4b4b;                       /* [wykryte; dla akapitów: wywnioskowane AA] */
  --color-text-muted: #777777;                         /* [wykryte] tylko tekst duży */
  --color-text-disabled: #afafaf;                      /* [wykryte] tylko nieaktywne i dekoracja */
  --color-text-display: #042c60;                       /* [wykryte (CSS var); rola: wywnioskowane AA] */
  --color-text-link: #2b70c9;                          /* [wykryte (CSS var); rola: wywnioskowane AA] */
  --color-text-link-on-info: #042c60;                  /* [wywnioskowane AA] */
  --color-text-on-brand: #3c3c3c;                      /* [wywnioskowane AA] */
  --color-text-on-info-fill: #042c60;                  /* [wywnioskowane AA, do weryfikacji] */
  --color-text-on-inverse: #ffffff;                    /* [wykryte] */

  /* Akcje */
  --color-action-primary-fill: #58cc02;                /* [wykryte] */
  --color-action-primary-edge: #58a700;                /* [wykryte] */
  --color-action-primary-text: var(--color-text-on-brand);      /* [wywnioskowane AA] */
  --color-action-secondary-fill: #ffffff;              /* [wykryte] */
  --color-action-secondary-border: #e5e5e5;            /* [wykryte] */
  --color-action-secondary-edge: #e5e5e5;              /* [wykryte] */
  --color-action-secondary-text: var(--color-text-link);        /* [wywnioskowane AA] */
  --color-action-neutral-text: #4b4b4b;                /* [wykryte] */
  --color-action-info-fill: #1cb0f6;                   /* [wykryte] */
  --color-action-info-edge: #1899d6;                   /* [wykryte] */
  --color-action-info-text: var(--color-text-on-info-fill);     /* [wywnioskowane AA, do weryfikacji] */

  /* Statusy  [kolory: wykryte (CSS var); role: wywnioskowane] */
  --color-status-success-fill: #58cc02;
  --color-status-success-edge: #58a700;
  --color-status-success-surface: #d7ffb8;
  --color-status-info-fill: #1cb0f6;
  --color-status-info-edge: #1899d6;
  --color-status-info-surface: #ddf4ff;
  --color-status-warning-fill: #ff9600;
  --color-status-warning-edge: #cd7900;
  --color-status-warning-surface: #fff5d3;
  --color-status-error-fill: #ff4b4b;
  --color-status-error-edge: #ea2b2b;
  --color-status-error-surface: #ffdfe0;

  /* Dekoracyjne  [wykryte (CSS var)] tylko ilustracje, bez tekstu */
  --color-decorative-violet: #ce82ff;
  --color-decorative-yellow: #ffc800;
  --color-decorative-teal: #00cd9c;

  /* Fokus */
  --color-focus-ring: #042c60;                         /* [wywnioskowane] */
  --color-focus-ring-on-inverse: #ffffff;              /* [wywnioskowane] */
  --focus-ring-width: 3px;                             /* [wykryte] */
  --focus-ring-offset: 1px;                            /* [wykryte] */

  /* Kroje */
  --font-display: "Nunito", sans-serif;                /* [do weryfikacji] zamiennik */
  --font-ui: "Nunito", sans-serif;                     /* [do weryfikacji] zamiennik */
  --font-weight-regular: 400;                          /* [wykryte] */
  --font-weight-bold: 700;                             /* [wykryte] */
  --font-weight-display: 800;                          /* [do weryfikacji] */
  --tracking-label: 0.8px;                             /* [wykryte] */
  --tracking-display-xl: -0.02em;                      /* [wykryte] */
  --tracking-app-label: 0.04em;                        /* [wykryte (CSS var)] */

  /* Typografia: strony publiczne  [wykryte; interlinie po zmianie kroju: do weryfikacji] */
  --type-display-xl-size: 36px;                        /* 48px od 768, 64px od 1080 */
  --type-display-lg-size: 36px;                        /* 48px od 768 */
  --type-display-xl: var(--font-weight-display) var(--type-display-xl-size)/normal var(--font-display);
  --type-display-lg: var(--font-weight-display) var(--type-display-lg-size)/normal var(--font-display);
  --type-title-hero: 700 32px/40px var(--font-ui);
  --type-title-modal: 700 26px/40px var(--font-ui);
  --type-title-section: 700 19px/24px var(--font-ui);
  --type-title-footer: 700 19px/26.6px var(--font-ui);
  --type-title-card: 700 17px/20.4px var(--font-ui);
  --type-body: 400 17px/24px var(--font-ui);
  --type-body-card: 400 17px/19.55px var(--font-ui);
  --type-input: 400 20px/28px var(--font-ui);
  --type-label-button: 700 15px/18px var(--font-ui);
  --type-label-small: 700 15px/20px var(--font-ui);
  --type-link-footer: 700 15px/22px var(--font-ui);
  --type-caption-legal: 400 14px/20px var(--font-ui);  /* grubość 400: do weryfikacji */

  /* Typografia: ekrany aplikacji  [wykryte (CSS var); użycie: wywnioskowane] */
  --type-app-page-title-lg: 700 40px/44px var(--font-ui);
  --type-app-page-title-sm: 700 32px/36px var(--font-ui);
  --type-app-heading-lg: 700 28px/32px var(--font-ui);
  --type-app-heading-md: 700 24px/32px var(--font-ui);
  --type-app-heading-sm: 700 20px/24px var(--font-ui);
  --type-app-heading-xs: 700 16px/20px var(--font-ui);
  --type-app-body: 400 20px/28px var(--font-ui);
  --type-app-body-spacious: 400 20px/32px var(--font-ui);
  --type-app-caption: 400 16px/24px var(--font-ui);
  --type-app-label-lg: 700 24px/24px var(--font-ui);   /* + uppercase, --tracking-app-label */
  --type-app-label-md: 700 16px/16px var(--font-ui);   /* + uppercase, --tracking-app-label */

  /* Odstępy: skala  [wykryte; skala 4px: wywnioskowane] */
  --space-xs: 8px;
  --space-sm: 12px;
  --space-md: 16px;
  --space-lg: 20px;
  --space-xl: 24px;
  --space-2xl: 32px;
  --space-3xl: 40px;
  --space-4xl: 48px;                                   /* [do weryfikacji] */
  --space-5xl: 64px;
  --space-6xl: 96px;
  /* Odstępy lokalne  [wykryte] tylko w opisanych miejscach */
  --space-gutter-phone: 15px;
  --space-gutter: 15px;                                /* 40px od 768 */
  --space-row-gap: 101px;
  --space-field-x: 14px;
  --space-list-footer: 14px;
  --space-card-media-title: 22px;
  --space-card-title-meta: 6px;
  --space-heading-grid: 80px;
  --space-stack-alt: 15px;                             /* [do weryfikacji] */

  /* Rozmiary  [wykryte, chyba że opisano inaczej] */
  --size-control-height: 50px;
  --size-field-height: 48px;
  --size-field-height-with-action: 60px;
  --size-cta-width: 330px;
  --size-header-height: 72px;
  --size-strip-height: 80px;
  --size-media-feature: min(345px, calc(100vw - 30px)); /* 452px od 768, 530px od 1080 */
  --size-card-choice-min: 150px;
  --size-card-choice: 200px;
  --size-card-choice-max: 240px;
  --size-card-choice-height: 217px;
  --size-card-media-w: 88px;
  --size-card-media-h: 68px;
  --size-footer-column: 216px;                         /* 178px od 1080 */
  --size-icon: 1em;                                    /* [wywnioskowane, do weryfikacji] */

  /* Kontenery  [wykryte] */
  --container-content: 988px;
  --container-wide: 1090px;
  --container-max: 1440px;
  --container-statement: 583px;
  --container-heading: 503px;
  --container-text: 473px;
  --container-hero-title: 480px;
  --container-form: 375px;
  --container-footer: 375px;                           /* 768px od 768, 988px od 1080 */

  /* Zaokrąglenia, ramki, krawędź  [wykryte] */
  --radius-md: 12px;
  --radius-lg: 16px;
  --border-width: 2px;
  --border-width-card-bottom: 4px;
  --edge-height: 4px;
  --edge-height-outline: 2px;

  /* Ruch  [wykryte; --motion-duration-fast: element do weryfikacji] */
  --motion-state: 0ms;
  --motion-duration-fast: 200ms;
  --motion-duration-base: 300ms;
  --motion-duration-slow: 400ms;
  --motion-duration-slower: 500ms;
  --motion-easing-out: cubic-bezier(0.22, 1, 0.36, 1);
  --motion-easing-standard: ease;
  --motion-easing-in-out: ease-in-out;
}

/* Breakpointy nie działają jako zmienne w @media, dlatego wpisuj je literalnie: 768px (bp.md), 1080px (bp.lg). */
@media (min-width: 768px) {
  :root {
    --type-display-xl-size: 48px;
    --type-display-lg-size: 48px;
    --space-gutter: 40px;
    --size-media-feature: 452px;
    --container-footer: 768px;
  }
}
@media (min-width: 1080px) {
  :root {
    --type-display-xl-size: 64px;
    --size-media-feature: 530px;
    --size-footer-column: 178px;
    --container-footer: 988px;
  }
}

/* Baza dokumentu  [wywnioskowane: kolor i krój z wykrytych wartości dokumentu] */
body {
  margin: 0;
  background: var(--color-surface-page);
  color: var(--color-text-strong);
  font: var(--type-body);
}

/* ===== 1. Przyciski ===== */
.btn {
  --btn-fill: var(--color-action-primary-fill);
  --btn-edge: var(--color-action-primary-edge);
  --btn-text: var(--color-action-primary-text);
  --btn-press: var(--edge-height);

  position: relative;
  isolation: isolate;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-xs);
  height: var(--size-control-height);
  padding: 0 var(--space-md);
  border: 0 solid transparent;
  border-bottom-width: var(--edge-height);
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--btn-text);
  font: var(--type-label-button);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  text-decoration: none;
  cursor: pointer;
}
.btn::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  border-radius: inherit;
  background: var(--btn-fill);
  box-shadow: 0 var(--edge-height) 0 var(--btn-edge);
}
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: translateY(var(--btn-press)); }
.btn:active::before { box-shadow: none; }
.btn:focus-visible { outline: var(--focus-ring-width) solid var(--color-focus-ring); outline-offset: var(--focus-ring-offset); }

.btn--secondary, .btn--neutral {
  --btn-fill: var(--color-action-secondary-fill);
  --btn-edge: var(--color-action-secondary-edge);
  --btn-press: var(--edge-height-outline);
  border-width: var(--border-width) var(--border-width) var(--edge-height);
}
.btn--secondary { --btn-text: var(--color-action-secondary-text); }
.btn--neutral   { --btn-text: var(--color-action-neutral-text); }
.btn--secondary::before, .btn--neutral::before {
  inset: calc(var(--border-width) * -1);
  border: var(--border-width) solid var(--color-action-secondary-border);
  box-shadow: 0 var(--edge-height-outline) 0 var(--btn-edge);
}
.btn--secondary:hover, .btn--neutral:hover { filter: brightness(0.9); }

.btn--info {
  --btn-fill: var(--color-action-info-fill);
  --btn-edge: var(--color-action-info-edge);
  --btn-text: var(--color-action-info-text);
}

.btn--app   { border-radius: var(--radius-lg); }
.btn--cta   { width: var(--size-cta-width); max-width: 100%; }
.btn--block { width: 100%; }
.btn__icon  { width: var(--size-icon); height: var(--size-icon); flex: none; }

/* nieaktywny: wywnioskowane, do weryfikacji */
.btn:disabled, .btn[aria-disabled="true"] {
  --btn-fill: var(--color-surface-disabled);
  --btn-text: var(--color-text-disabled);
  cursor: not-allowed;
  filter: none;
  transform: none;
}
.btn:disabled::before, .btn[aria-disabled="true"]::before { box-shadow: none; }

.btn-stack { display: flex; flex-direction: column; align-items: center; gap: var(--space-sm); }

/* ===== 2. Link w tekście ===== */
.link { color: var(--color-text-link); font-weight: var(--font-weight-bold); text-decoration: none; }
.link:focus-visible { outline: var(--focus-ring-width) solid var(--color-focus-ring); outline-offset: var(--focus-ring-offset); }
.surface-info { background: var(--color-surface-info); }
.surface-info .link { color: var(--color-text-link-on-info); }

/* ===== 3. Karta wyboru ===== */
.choice-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(var(--size-card-choice-min), 1fr));
  gap: var(--space-sm);
  margin-top: var(--space-heading-grid);
  padding: 0;
  list-style: none;
}
@media (min-width: 700px) { .choice-grid { gap: var(--space-xl); } }
@media (min-width: 1080px) {
  .choice-grid { grid-template-columns: repeat(4, var(--size-card-choice)); justify-content: center; }
}
.choice-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: var(--size-card-choice-max);
  min-height: var(--size-card-choice-height);
  justify-self: center;
  padding: var(--space-sm) var(--space-sm) var(--space-xl);
  background: var(--color-surface-page);
  border: var(--border-width) solid var(--color-border-default);
  border-bottom-width: var(--border-width-card-bottom);
  border-radius: var(--radius-lg);
  color: var(--color-text-primary);
  font: var(--type-body-card);
  text-align: center;
  cursor: pointer;
}
.choice-card:hover { filter: brightness(0.9); }
.choice-card[aria-checked="true"],
.choice-card[aria-pressed="true"],
.choice-card[aria-expanded="true"] {
  border-color: var(--color-border-focus);
  background: var(--color-surface-info);
}
.choice-card:focus-visible { outline: var(--focus-ring-width) solid var(--color-focus-ring); outline-offset: var(--focus-ring-offset); }
.choice-card__media { width: var(--size-card-media-w); height: var(--size-card-media-h); margin: auto 0 var(--space-card-media-title); object-fit: contain; }
.choice-card__title { font: var(--type-title-card); }
.choice-card__meta  { margin-top: var(--space-card-title-meta); font: var(--type-body-card); }

/* ===== 4. Pole formularza ===== */
.form-stack { display: grid; gap: var(--space-sm); }
.form-stack__submit { margin-top: calc(var(--space-xl) - var(--space-sm)); }
.field-group { display: grid; gap: var(--space-xs); }
.field-label { font: var(--type-title-card); color: var(--color-text-primary); }
.field-hint  { margin: 0; font: var(--type-body); color: var(--color-text-primary); }
.field {
  display: flex;
  align-items: center;
  min-height: var(--size-field-height);
  background: var(--color-surface-subtle);
  border: var(--border-width) solid var(--color-border-field);
  border-radius: var(--radius-md);
}
.field:has(.field__input[aria-invalid="true"]) { border-color: var(--color-border-error); }
.field:focus-within,
.field:has(.field__input[aria-invalid="true"]):focus-within { border-color: var(--color-border-focus); }
.field__input {
  flex: 1;
  min-width: 0;
  padding: var(--space-xs) var(--space-field-x);
  border: 0;
  background: transparent;
  font: var(--type-input);
  color: var(--color-text-primary);
}
.field__input:focus { outline: none; }
.field__action { padding: 0 var(--space-field-x); font: var(--type-label-small); letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--color-text-link); text-decoration: none; }
.field-message { display: flex; gap: var(--space-xs); margin: 0; font: var(--type-body); color: var(--color-text-primary); }
.field-message__icon { flex: none; width: var(--size-icon); height: var(--size-icon); margin-top: 0.2em; color: var(--color-status-error-edge); }
/* ===== 10. Komunikat statusu (wywnioskowane, do weryfikacji) ===== */
.notice {
  display: flex;
  gap: var(--space-xs);
  padding: var(--space-md);
  background: var(--color-status-info-surface);
  border: var(--border-width) solid var(--color-status-info-edge);
  border-bottom-width: var(--border-width-card-bottom);
  border-radius: var(--radius-lg);
  font: var(--type-body);
  color: var(--color-text-primary);
}
.notice__icon { flex: none; width: var(--size-icon); height: var(--size-icon); margin-top: 0.2em; color: var(--color-status-info-edge); }
.notice--success { background: var(--color-status-success-surface); border-color: var(--color-status-success-edge); }
.notice--success .notice__icon { color: var(--color-status-success-edge); }
.notice--warning { background: var(--color-status-warning-surface); border-color: var(--color-status-warning-edge); }
.notice--warning .notice__icon { color: var(--color-status-warning-edge); }
.notice--error   { background: var(--color-status-error-surface);   border-color: var(--color-status-error-edge); }
.notice--error .notice__icon { color: var(--color-status-error-edge); }

/* ===== 11. Komponenty złożone (wywnioskowane, do weryfikacji) ===== */
.panel {
  width: 100%;
  max-width: var(--container-form);
  padding: var(--space-xl);
  background: var(--color-surface-page);
  border: var(--border-width) solid var(--color-border-default);
  border-bottom-width: var(--border-width-card-bottom);
  border-radius: var(--radius-lg);
  text-align: start;
}
.panel__row + .panel__row { margin-top: var(--space-xl); padding-top: var(--space-xl); border-top: var(--border-width) solid var(--color-border-default); }
.panel__label { font: var(--type-label-small); letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--color-text-primary); }

.tabs { display: flex; gap: var(--space-xs); }
.tabs .tab { flex: 1; }
.tab[aria-selected="true"]::before {
  border-color: var(--color-border-focus);
  background: var(--color-surface-info);
  box-shadow: 0 var(--edge-height-outline) 0 var(--color-border-focus);
}
.tab[aria-selected="true"]:active { transform: none; }

.badge {
  display: inline-block;
  padding: 0 var(--space-xs);
  border-radius: var(--radius-md);
  background: var(--color-status-info-surface);
  font: var(--type-label-small);
  letter-spacing: var(--tracking-label);
  text-transform: uppercase;
  color: var(--color-text-primary);
}

.media-placeholder {
  width: var(--size-media-feature);
  aspect-ratio: 1;
  background: var(--color-surface-subtle);
  border: var(--border-width) solid var(--color-border-default);
  border-radius: var(--radius-lg);
}


/* =====================================================================
   Przewodnik Rodzica · strona po zalogowaniu (S1–S13)
   Responsywność przez @container na .app (progi literalnie: 768px, 1080px, 700px).
   Elementy spoza listy komponentów systemu: „nowy komponent: do weryfikacji”.
   ===================================================================== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0ms !important; animation-duration: 0ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
}
.sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; } /* wyjątek: technika ukrycia */
.ic { width: var(--size-icon); height: var(--size-icon); flex: none; }
.ic-lg { width: var(--space-xl); height: var(--space-xl); flex: none; }
h1, h2, h3, h4, p { margin: 0; }
[tabindex="-1"]:focus { outline: none; }
.page__title:focus-visible { outline: var(--focus-ring-width) solid var(--color-focus-ring); outline-offset: var(--focus-ring-offset); }

.app { container-type: inline-size; position: relative; width: 100%; min-height: 100vh; background: var(--color-surface-page); color: var(--color-text-strong); font: var(--type-app-caption); }
.wrap { width: 100%; padding-inline: var(--space-gutter-phone); }
@container (min-width: 768px) { .wrap { padding-inline: var(--space-3xl); } } /* do weryfikacji: --space-3xl zamiast --space-gutter (przełącza się @media) */
@container (min-width: 1080px) { .wrap { width: var(--container-content); margin-inline: auto; padding-inline: 0; } }

/* ---------- typografia aplikacji ---------- */
.t-page { font: var(--type-app-heading-lg); color: var(--color-text-strong); }
@container (min-width: 1080px) { .t-page { font: var(--type-app-page-title-sm); } }
.t-h2 { font: var(--type-app-heading-md); color: var(--color-text-strong); }

@container (max-width: 767px) { .cmp__row { min-width: 0; } .cmp--5 .cmp__row { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cmp--5 .cmp__row--head { display: none; } }
.cmp__row--head { font: var(--type-label-small); letter-spacing: var(--tracking-label); text-transform: uppercase; }
@container (min-width: 768px) { .path__stage { padding-right: var(--space-sm); border-left: var(--border-width) dashed var(--color-border-default); padding-left: var(--space-xs); } }
/* Obszar treści jest osobnym kontenerem: przy otwartym panelu Zusika układ liczy się od jego szerokości */
.main { container-type: inline-size; }

/* nowy komponent: do weryfikacji — separator szerokości panelu (mysz i klawiatura) */
.zp__sep { display: none; }
@container (min-width: 768px) {
  .zp.is-split .zp__sep { display: block; position: absolute; top: 0; bottom: 0; left: calc(var(--space-sm) * -0.5); width: var(--space-sm); z-index: 2; cursor: col-resize; background: var(--color-surface-page); border-left: var(--border-width) solid var(--color-border-default); border-right: var(--border-width) solid var(--color-border-default); touch-action: none; }
  .zp.is-split .zp__sep:hover { background: var(--color-surface-subtle); }
  .zp.is-split .zp__sep:focus-visible { outline: var(--focus-ring-width) solid var(--color-focus-ring); outline-offset: var(--focus-ring-offset); }
}
.save-err { display: grid; gap: var(--space-xs); padding: var(--space-sm); border: var(--border-width) solid var(--color-status-error-edge); border-radius: var(--radius-md); background: var(--color-status-error-surface); }


/* =====================================================================
   Restyling (tylko CSS): płaskie ramki 2px, mięta zamiast limonki, bez cieni,
   bez dolnej krawędzi klawiszy i bez przesuwania przy naciśnięciu.
   Kolory od zespołu; tam gdzie nie było tokenu, nadpisujemy istniejące.
   ===================================================================== */
:root {
  --color-surface-page: #ffffff;
  --color-surface-brand: #A3DAB3;
  --color-surface-info: #DDF4FF;            /* do weryfikacji: jasne tło zaznaczenia pod #3F84D2 */
  --color-text-display: #1E3D5C;
  --color-text-primary: #4B4B4B;
  --color-text-link: #00416E;
  --color-text-link-on-info: #00416E;
  --color-text-on-brand: #1E3D5C;
  --color-border-default: #BEC3CE;
  --color-border-focus: #3F84D2;
  --color-focus-ring: #1E3D5C;
  --color-action-primary-fill: #A3DAB3;
  --color-action-primary-edge: #338C5C;
  --color-action-primary-text: #1E3D5C;
  --color-action-secondary-border: #BEC3CE;
  --color-action-secondary-edge: #BEC3CE;
  --color-action-secondary-text: #00416E;
  --color-status-success-fill: #A3DAB3;
  --color-status-success-edge: #338C5C;
  --color-status-success-surface: #A3DAB3;
  --color-status-info-edge: #3F84D2;
  --color-status-info-surface: #DDF4FF;
  --color-status-warning-fill: #FFB34F;
  --color-status-warning-edge: #FFB34F;
  /* płasko: bez dolnej krawędzi i bez przesunięcia */
  --edge-height: 0px;
  --edge-height-outline: 0px;
  --border-width-card-bottom: 2px;
}
/* Pola formularza zachowują --color-border-field (#777): #BEC3CE na białym ma ok. 1,8:1, poniżej 3:1 wymaganego dla obrysu pola (WCAG 1.4.11). Do weryfikacji. */

*, *::before, *::after { box-shadow: none !important; text-shadow: none !important; background-image: none; }

/* ---------- przyciski: równa ramka 2px, bez wciśnięcia ---------- */
.btn { border: 0; }
.btn::before { inset: 0; border: var(--border-width) solid var(--btn-border, var(--color-action-primary-edge)); }
.btn { --btn-border: var(--color-action-primary-edge); }
.btn--secondary, .btn--neutral { --btn-border: var(--color-action-secondary-border); border-width: 0; }
.btn--secondary::before, .btn--neutral::before { inset: 0; border: var(--border-width) solid var(--btn-border); }
.btn:active, .btn.is-active, .sel:active, .node:active, .pion:active, .fab:active, .nav-bot__item:active, .starter:active { transform: none; }
.btn:disabled, .btn[aria-disabled="true"] { --btn-border: var(--color-border-default); }
.tab[aria-current="page"]::before, .tab[aria-pressed="true"]::before, .tab[aria-selected="true"]::before { border-color: var(--color-border-focus); background: var(--color-surface-info); }
.tab[aria-current="page"], .tab[aria-pressed="true"], .tab[aria-selected="true"] { --btn-text: var(--color-text-display); }

/* ---------- nagłówki ---------- */
.t-page, .t-h2, .t-h3, .t-h4, .next__title, .bubble__text, .zp__title, .diff__head, .date__legend, .brand, .sel__name, .alert__title, .case__name, .stop__name, .kpi__v, .track__name, .t-big { color: #1E3D5C; }

/* ---------- karty, panele, komunikaty: płaska ramka 2px ---------- */
.card, .panel, .case, .notice, .alert, .stage, .bubble, .choice-card, .assume, .diff, .cal, .sel, .sel-menu, .segcard, .example-bar, .loading, .ask-form, .inline-edit, .annot, .flag-line, .save-err, .starter, .kpi, .nav-bot__item, .node, .pion, .fab { border-width: var(--border-width); border-style: solid; }
.kpi, .loading { border-color: var(--color-border-default); }
.example-bar, .ask-form { border-color: var(--color-border-default); }
.notice { border-color: var(--color-status-info-edge); }
.notice--success { border-color: var(--color-status-success-edge); color: #1E3D5C; }
.notice--warning, .alert { border-color: var(--color-status-warning-edge); }
.notice--error, .save-err { border-color: var(--color-status-error-edge); }
.next.is-sheet { border-bottom-width: 0; }
.card--info { border-color: var(--color-border-focus); }

/* ---------- tekst na mięcie ---------- */
.badge--ok, .msg--me, .sum__row.is-changed, .diff, .node--done, .notice--success span, .notice--success strong { color: #1E3D5C; }
.badge--ok { border: var(--border-width) solid var(--color-status-success-edge); }
.sum__row.is-changed { border: var(--border-width) solid var(--color-status-success-edge); }
.msg--me { border: var(--border-width) solid var(--color-status-success-edge); }

/* ---------- plakietki: ramka zamiast imitacji cieniem ---------- */
.badge { border: var(--border-width) solid transparent; }
.badge--example, .badge--muted { border-color: var(--color-border-default); }
.badge--todo { border-color: var(--color-border-focus); }
.badge--warn, .badge--test { border-color: var(--color-status-warning-edge); }
.count { background: #FFB34F; color: #1E3D5C; }

/* ---------- ścieżka ---------- */
.node--done { background: var(--color-status-success-fill); border-color: var(--color-status-success-edge); }
.node--next { background: var(--color-surface-info); border-color: var(--color-border-focus); }
.node--warn { background: var(--color-status-warning-surface); border-color: #FFB34F; }
.node--warn .node__mark { background: #FFB34F; color: #1E3D5C; }
.node--info { border-color: var(--color-border-default); }
.pion, .fab { border-color: var(--color-status-success-edge); }
.blob { border: var(--border-width) solid var(--color-status-success-edge); }
.stage { border-color: var(--color-border-focus); }
.path__stage { border-left-color: var(--color-border-default); }

/* ---------- wypełnienia postępu: zieleń zamiast limonki ---------- */
.progress__bar, .meter__fill { background: var(--color-status-success-edge); }
.seg--b { background: var(--color-status-success-surface); border-color: var(--color-status-success-edge); }
.seg--o { border-color: #FFB34F; }
.tl--done .tl__dot { background: var(--color-status-success-fill); border-color: var(--color-status-success-edge); color: #1E3D5C; }
.tl--now .tl__dot { border-color: #FFB34F; }

/* ---------- wybór i fokus: rozróżnialne ---------- */
.choice-card[aria-checked="true"], .sel-item[aria-current="true"], .nav-bot__item[aria-current="page"] { border-color: var(--color-border-focus); background: var(--color-surface-info); color: #1E3D5C; }
.choice-card[aria-checked="true"] .choice-card__check { border-color: var(--color-border-focus); color: #1E3D5C; }
.field:focus-within { border-color: var(--color-border-focus); }
.composer.is-busy { border-color: var(--color-status-success-edge); }
.case__miss .ic { color: #1E3D5C; }

/* Zachowanie rozmiarów: dolna ramka zeszła z 4px do 2px, więc oddajemy 2px w dolnym odstępie wewnętrznym */
.choice-card--q { padding-bottom: calc(var(--space-sm) + var(--border-width)); }
.card:not(.pool):not(.card--flat) { padding-bottom: calc(var(--space-xl) + var(--border-width)); }
.card--flat { padding-bottom: calc(var(--space-md) + var(--border-width)); }
.case, .notice, .diff { padding-bottom: calc(var(--space-md) + var(--border-width)); }
.alert, .bubble, .segcard, .example-bar, .cal { padding-bottom: calc(var(--space-sm) + var(--border-width)); }
.stage, .sel-menu { padding-bottom: calc(var(--space-xs) + var(--border-width)); }
.panel:not(.pool) { padding-bottom: calc(var(--space-xl) + var(--border-width)); }
.pool { padding-bottom: var(--border-width); }

body{margin:0}
</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">
<div class="{{appCls}}" style="{{appStyle}}">
<p class="sr" role="status" aria-live="polite">{{live}}</p>

<!-- ======================= ONBOARDING (S1–S4) ======================= -->
<sc-if value="{{isOb}}" hint-placeholder-val="{{true}}">
<main class="ob wrap">
<div class="ob__top">
<span class="brand">Przewodnik Rodzica</span>
</div>

<sc-if value="{{obStart}}" hint-placeholder-val="{{true}}">
<div class="ob__col">
<div class="start-hero">
<span class="blob blob--lg" role="img" aria-label="Zusik"></span>
<div class="bubble">
<span class="badge badge--ai" style="justify-self: start">AI</span>
<h1 class="bubble__text" data-focus-title="1" tabindex="-1">Pomogę Ci ułożyć plan. 4 krótkie pytania · ok. 1 minuty</h1>
</div>
<button type="button" class="btn btn--app" onClick="{{goStart}}">Zaczynamy</button>
<div class="start-links">
<button type="button" class="link-btn" onClick="{{lookAround}}">Najpierw rozejrzę się bez dopasowania</button>
<button type="button" class="link-btn" onClick="{{goSupportOb}}">Potrzebuję wsparcia w trudnej sytuacji</button>
</div>
</div>
<div class="card card--flat">
<button type="button" class="disclosure" aria-expanded="{{startExp}}" aria-controls="start-data" onClick="{{startToggle}}">Sprawdź dane startowe
<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button>
<sc-if value="{{startOpen}}" hint-placeholder-val="{{false}}">
<dl class="sum" id="start-data">
<sc-for list="{{startRows}}" as="r" hint-placeholder-count="5">
<div class="sum__row">
<dt class="sum__label">{{r.label}}</dt>
<dd class="sum__value">{{r.value}}</dd>
<dd class="sum__src"><sc-if value="{{r.lock}}" hint-placeholder-val="{{false}}"><span class="src" aria-hidden="true"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="10" height="7" rx="2"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg>{{r.src}}</span><span class="sr">{{r.sr}}</span></sc-if><sc-if value="{{r.can}}" hint-placeholder-val="{{false}}"><span class="src">{{r.src}}</span></sc-if></dd>
<dd class="sum__act"></dd>
</div>
</sc-for>
</dl>
</sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{obQ}}" hint-placeholder-val="{{false}}">
<div class="ob__col">
<sc-if value="{{resumed}}" hint-placeholder-val="{{false}}"><div class="notice" role="status"><svg class="notice__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="3"/><path d="M8 7v4M8 4.8v.1"/></svg><div class="stack-sm"><span>Wznowiliśmy od ostatniego pytania. Odpowiedzi zapisujemy tylko w tej przeglądarce (demo).</span><button type="button" class="link-btn" onClick="{{resetOb}}">Zacznij od nowa</button></div></div></sc-if>
<div class="ob__nav">
<button type="button" class="link-btn back" onClick="{{obBack}}"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>Wstecz</button>
<div class="progress" aria-hidden="true"><div class="progress__bar" style="{{obProgress}}"></div></div>
</div>
<div class="zusik">
<span class="blob blob--sm" role="img" aria-label="Zusik"></span>
<div class="bubble">
<span class="badge badge--ai" style="justify-self: start">AI</span>
<sc-if value="{{obBubbleSmall}}" hint-placeholder-val="{{false}}"><p class="bubble__more">{{nameBubble}}</p></sc-if>
<h1 class="bubble__text" id="ob-q" data-focus-title="1" tabindex="-1">{{obQText}}</h1>
<button type="button" class="link-btn" aria-expanded="{{obWhyExp}}" onClick="{{toggleObWhy}}">Dlaczego pytamy?</button>
<sc-if value="{{obWhyOpen}}" hint-placeholder-val="{{false}}"><p class="bubble__more">{{obWhy}}</p></sc-if>
</div>
</div>

<sc-if value="{{isWho}}" hint-placeholder-val="{{true}}">
<div class="choice-grid choice-grid--q" role="radiogroup" aria-labelledby="ob-q">
<sc-for list="{{whoChoices}}" as="c" hint-placeholder-count="6">
<button type="button" class="choice-card choice-card--q" role="radio" aria-checked="{{c.checked}}" tabIndex="{{c.tab}}" onClick="{{c.pick}}" onKeyDown="{{c.key}}">
<span>{{c.label}}<sc-if value="{{c.hasSub}}" hint-placeholder-val="{{false}}"><span class="choice-card__sub">{{c.sub}}</span></sc-if></span>
<span class="choice-card__check" aria-hidden="true"><sc-if value="{{c.isChecked}}" hint-placeholder-val="{{false}}"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg></sc-if></span>
</button>
</sc-for>
</div>
<div class="ob__helpers"><button type="button" class="link-btn" onClick="{{goSupportOb}}">Potrzebuję wsparcia w trudnej sytuacji</button></div>
</sc-if>

<sc-if value="{{isRole}}" hint-placeholder-val="{{false}}">
<div class="choice-grid choice-grid--q" role="radiogroup" aria-labelledby="ob-q">
<sc-for list="{{roleChoices}}" as="c" hint-placeholder-count="2">
<button type="button" class="choice-card choice-card--q" role="radio" aria-checked="{{c.checked}}" tabIndex="{{c.tab}}" onClick="{{c.pick}}" onKeyDown="{{c.key}}">
<span>{{c.label}}</span>
<span class="choice-card__check" aria-hidden="true"><sc-if value="{{c.isChecked}}" hint-placeholder-val="{{false}}"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg></sc-if></span>
</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isCount}}" hint-placeholder-val="{{false}}">
<div class="choice-grid choice-grid--q" role="radiogroup" aria-labelledby="ob-q">
<sc-for list="{{countChoices}}" as="c" hint-placeholder-count="3">
<button type="button" class="choice-card choice-card--q" role="radio" aria-checked="{{c.checked}}" tabIndex="{{c.tab}}" onClick="{{c.pick}}" onKeyDown="{{c.key}}">
<span>{{c.label}}</span>
<span class="choice-card__check" aria-hidden="true"><sc-if value="{{c.isChecked}}" hint-placeholder-val="{{false}}"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg></sc-if></span>
</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isJob}}" hint-placeholder-val="{{false}}">
<div class="choice-grid choice-grid--q" role="radiogroup" aria-labelledby="ob-q">
<sc-for list="{{jobChoices}}" as="c" hint-placeholder-count="3">
<button type="button" class="choice-card choice-card--q" role="radio" aria-checked="{{c.checked}}" tabIndex="{{c.tab}}" onClick="{{c.pick}}" onKeyDown="{{c.key}}">
<span>{{c.label}}</span>
<span class="choice-card__check" aria-hidden="true"><sc-if value="{{c.isChecked}}" hint-placeholder-val="{{false}}"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg></sc-if></span>
</button>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isDate}}" hint-placeholder-val="{{false}}">
<fieldset class="date" aria-describedby="{{dDesc}}">
<legend class="sr">{{obQText}}</legend>
<p class="date__hint" id="ob-dhint">{{dHint}}</p>
<div class="date__parts">
<div class="date__part"><label class="field-label" for="ob-dd">Dzień</label><div class="field"><input class="field__input" id="ob-dd" type="text" inputMode="numeric" maxLength="2" value="{{d.day}}" onChange="{{onDD}}" aria-invalid="{{dInv}}" aria-describedby="{{dDesc}}"></div></div>
<div class="date__part"><label class="field-label" for="ob-dm">Miesiąc</label><div class="field"><input class="field__input" id="ob-dm" type="text" inputMode="numeric" maxLength="2" value="{{d.month}}" onChange="{{onDM}}" aria-invalid="{{dInv}}" aria-describedby="{{dDesc}}"></div></div>
<div class="date__part date__part--year"><label class="field-label" for="ob-dy">Rok</label><div class="field"><input class="field__input" id="ob-dy" type="text" inputMode="numeric" maxLength="4" value="{{d.year}}" onChange="{{onDY}}" aria-invalid="{{dInv}}" aria-describedby="{{dDesc}}"></div></div>
</div>
<sc-if value="{{dInvalid}}" hint-placeholder-val="{{false}}"><p class="field-message field-message--todo" id="ob-derr"><svg class="field-message__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="3"/><path d="M8 5v3.5M8 11v.1"/></svg><span>{{dErrText}}</span></p></sc-if>
</fieldset>
</sc-if>

<sc-if value="{{isName}}" hint-placeholder-val="{{false}}">
<div class="field-group">
<label class="field-label" for="ob-name">Nazwa planu</label>
<p class="field-hint" id="ob-name-hint">Możesz to zmienić później</p>
<div class="field field--wide"><input class="field__input" id="ob-name" type="text" autoComplete="off" value="{{obName}}" onChange="{{onName}}" aria-describedby="ob-name-hint"></div>
</div>
</sc-if>

<div class="ob__foot">
<button type="button" class="btn btn--app" disabled="{{obNextDisabled}}" onClick="{{obNext}}">{{obNextLabel}}</button>
<sc-if value="{{obShowLater}}" hint-placeholder-val="{{false}}"><button type="button" class="link-btn" onClick="{{obLater}}">Uzupełnię później</button></sc-if>
<sc-if value="{{obShowSkip}}" hint-placeholder-val="{{false}}"><button type="button" class="link-btn" onClick="{{obSkip}}">Pomiń</button></sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{obSummary}}" hint-placeholder-val="{{false}}">
<div class="ob__col">
<div class="ob__nav">
<button type="button" class="link-btn back" onClick="{{obBack}}"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>Wstecz</button>
<div class="progress" aria-hidden="true"><div class="progress__bar" style="width: 100%"></div></div>
</div>
<div class="zusik">
<span class="blob blob--sm" role="img" aria-label="Zusik"></span>
<div class="bubble"><span class="badge badge--ai" style="justify-self: start">AI</span><h1 class="bubble__text" data-focus-title="1" tabindex="-1">{{sumBubble}}</h1></div>
</div>
<div class="card card--flat">
<div class="row-between"><h2 class="t-h4">Sprawdź dane startowe</h2>
<sc-if value="{{hasWarn}}" hint-placeholder-val="{{false}}"><span class="badge badge--warn">{{warnText}}</span></sc-if>
</div>
<dl class="sum">
<sc-for list="{{sumRows}}" as="r" hint-placeholder-count="7">
<div class="sum__row">
<dt class="sum__label">{{r.label}}</dt>
<dd class="sum__value">{{r.value}}</dd>
<dd class="sum__src"><sc-if value="{{r.lock}}" hint-placeholder-val="{{false}}"><span class="src" aria-hidden="true"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="10" height="7" rx="2"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg>{{r.src}}</span><span class="sr">{{r.sr}}</span></sc-if><sc-if value="{{r.can}}" hint-placeholder-val="{{true}}"><span class="src">{{r.src}}</span></sc-if></dd>
<dd class="sum__act"><sc-if value="{{r.can}}" hint-placeholder-val="{{true}}"><button type="button" class="link-btn" onClick="{{r.edit}}">Zmień<span class="sr">: {{r.label}}</span></button></sc-if></dd>
</div>
</sc-for>
</dl>
<sc-if value="{{hasWarn}}" hint-placeholder-val="{{false}}"><div class="notice notice--warning" style="margin-top: var(--space-md)"><svg class="notice__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2l6.5 12h-13z"/><path d="M8 6.5v3"/><path d="M8 12v.1"/></svg><span>Brak ubezpieczenia w dniu porodu: koniec umowy przed porodem może odebrać prawo do zasiłku. Ostrzeżenie zobaczysz przy przystanku „Planuję zmianę pracy”.</span></div></sc-if>
</div>
<div class="ob__foot"><button type="button" class="btn btn--app" onClick="{{showPlan}}">Pokaż mój plan</button></div>
</div>
</sc-if>
</main>
</sc-if>

<!-- ======================= APLIKACJA ======================= -->
<sc-if value="{{isApp}}" hint-placeholder-val="{{false}}">
<header class="bar">
<div class="wrap bar__in">
<span class="brand">Przewodnik Rodzica</span>
<div class="sel-wrap">
<button type="button" class="sel" aria-expanded="{{selExp}}" aria-haspopup="true" aria-controls="sel-menu" onClick="{{toggleSel}}">
<span class="sel__text"><span class="sel__name">{{selName}}</span><span class="sel__sub">{{selSub}}</span></span>
<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
</button>
<sc-if value="{{selOpen}}" hint-placeholder-val="{{false}}">
<div class="sel-menu" id="sel-menu">
<sc-for list="{{planItems}}" as="p" hint-placeholder-count="4">
<button type="button" class="sel-item" aria-current="{{p.cur}}" onClick="{{p.pick}}">
<span>{{p.label}}</span>
<span class="sel-item__meta">
<sc-if value="{{p.lock}}" hint-placeholder-val="{{false}}"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="2"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg></sc-if>
{{p.meta}}

</sc-if>
</div>
<nav class="nav-top" aria-label="Główne karty">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="3">
<button type="button" class="btn btn--neutral btn--app tab" aria-current="{{n.cur}}" onClick="{{n.go}}">{{n.label}}<sc-if value="{{n.hasCount}}" hint-placeholder-val="{{false}}"><span class="count" aria-hidden="true">{{n.count}}</span><span class="sr">, {{n.countSr}}</span></sc-if></button>

</div>
</header>

<main class="main">
<!-- ======================= MÓJ PLAN (S5, S6, S7, S8) ======================= -->
<sc-if value="{{isPlan}}" hint-placeholder-val="{{true}}">
<div class="wrap page">
<div class="page__head">
<div class="row">
<h1 class="t-page" data-focus-title="1" tabindex="-1">{{planTitle}}</h1>
<sc-if value="{{isExample}}" hint-placeholder-val="{{false}}"><span class="badge badge--example">Przykład</span></sc-if>
<sc-if value="{{isTestPlan}}" hint-placeholder-val="{{false}}"><span class="badge badge--test">Test</span></sc-if>
</div>
<p class="t-body">{{planLine}}</p>
<div class="row"><button type="button" class="link-btn" onClick="{{childData}}">Dane dziecka</button><button type="button" class="link-btn" onClick="{{openSupport}}">Spokojny widok: Wsparcie</button></div>
</div>
<sc-if value="{{isExample}}" hint-placeholder-val="{{false}}">
<div class="example-bar"><span>To plan przykładowy. Nic nie zapisujemy w Twoim profilu.</span><button type="button" class="btn btn--secondary btn--app" onClick="{{fit}}">Dopasuj plan do siebie</button></div>
</sc-if>
<sc-if value="{{hasReg}}" hint-placeholder-val="{{false}}">
<div class="notice" role="status"><svg class="notice__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="3"/><path d="M8 7v4M8 4.8v.1"/></svg><div class="stack-sm"><span>{{regNote}}. Dane urzędowe mają pierwszeństwo.</span><button type="button" class="link-btn" onClick="{{closeReg}}">Rozumiem</button></div></div>
</sc-if>

<section class="stack" aria-labelledby="map-title">
<h2 class="sr" id="map-title">Ścieżka planu</h2>
<div class="stage" role="region" aria-label="Bieżący etap">
<p class="stage__text">{{bannerText}}</p>
<button type="button" class="btn btn--secondary btn--app" aria-pressed="{{listPressed}}" onClick="{{toggleList}}">Lista</button>
</div>

<sc-if value="{{showPath}}" hint-placeholder-val="{{true}}">
<div class="path-wrap" onScroll="{{onPathScroll}}">
<svg class="arc" width="{{arc.w}}" height="{{arc.h}}" viewBox="{{arc.vb}}" aria-hidden="true"><path d="{{arc.d}}" fill="none" style="stroke: var(--color-border-default); stroke-width: var(--edge-height); stroke-linecap: round"/></svg>
<ol class="path" aria-label="Przystanki planu">
<sc-for list="{{pathRows}}" as="r" hint-placeholder-count="12">
<sc-if value="{{r.isHead}}" hint-placeholder-val="{{false}}">
<li class="path__stage" data-stage="{{r.si}}" style="{{r.headStyle}}"><span class="path__stage-name">{{r.name}}</span><sc-if value="{{r.hasSub}}" hint-placeholder-val="{{false}}"><span class="path__stage-sub">{{r.sub}}</span></sc-if></li>
</sc-if>
<sc-if value="{{r.isStop}}" hint-placeholder-val="{{true}}">
<li class="{{r.cls}}">
<button type="button" class="{{r.nodeCls}}" aria-pressed="{{r.pressed}}" onClick="{{r.open}}"><span class="sr">{{r.sr}}</span>
<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"/></svg>
<sc-if value="{{r.mark}}" hint-placeholder-val="{{false}}"><span class="node__mark" aria-hidden="true"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg></span></sc-if>
<sc-if value="{{r.warn}}" hint-placeholder-val="{{false}}"><span class="node__mark" aria-hidden="true"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v6M8 12.5v.1"/></svg></span></sc-if>
</button>
<div class="stop__label" aria-hidden="true">
<p class="stop__name">{{r.name}}</p>
<span class="badge {{r.badgeCls}}">{{r.status}}</span>
<sc-if value="{{r.hasTerm}}" hint-placeholder-val="{{false}}"><p class="stop__meta">{{r.term}}</p></sc-if>
</div>
</li>
</sc-if>
<sc-if value="{{r.isPion}}" hint-placeholder-val="{{false}}">
<li class="{{r.cls}}">
<button type="button" class="pion" onClick="{{openPion}}"><span class="blob" aria-hidden="true"></span><span class="sr">{{pionSr}}</span></button>
<div class="bubble" aria-hidden="true"><span class="stop__now">Teraz</span><p class="bubble__text">{{pionText}}</p></div>
</li>
</sc-if>
<sc-if value="{{r.isPair}}" hint-placeholder-val="{{false}}">
<li class="{{r.cls}}">
<div class="stop">
<button type="button" class="{{r.a.nodeCls}}" aria-pressed="{{r.a.pressed}}" onClick="{{r.a.open}}"><span class="sr">{{r.a.sr}}</span><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.a.icon}}"/></svg>
<sc-if value="{{r.a.mark}}" hint-placeholder-val="{{false}}"><span class="node__mark" aria-hidden="true"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg></span></sc-if>
<sc-if value="{{r.a.warn}}" hint-placeholder-val="{{false}}"><span class="node__mark" aria-hidden="true"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v6M8 12.5v.1"/></svg></span></sc-if></button>
<div class="stop__label" aria-hidden="true"><p class="stop__name">{{r.a.name}}</p><span class="badge {{r.a.badgeCls}}">{{r.a.status}}</span><sc-if value="{{r.a.hasTerm}}" hint-placeholder-val="{{false}}"><p class="stop__meta">{{r.a.term}}</p></sc-if></div>
</div>
<span class="pair__and">i</span>
<div class="stop">
<button type="button" class="{{r.b.nodeCls}}" aria-pressed="{{r.b.pressed}}" onClick="{{r.b.open}}"><span class="sr">{{r.b.sr}}</span><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.b.icon}}"/></svg>
<sc-if value="{{r.b.mark}}" hint-placeholder-val="{{false}}"><span class="node__mark" aria-hidden="true"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg></span></sc-if>
<sc-if value="{{r.b.warn}}" hint-placeholder-val="{{false}}"><span class="node__mark" aria-hidden="true"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v6M8 12.5v.1"/></svg></span></sc-if></button>
<div class="stop__label" aria-hidden="true"><p class="stop__name">{{r.b.name}}</p><span class="badge {{r.b.badgeCls}}">{{r.b.status}}</span><sc-if value="{{r.b.hasTerm}}" hint-placeholder-val="{{false}}"><p class="stop__meta">{{r.b.term}}</p></sc-if></div>
</div>
</li>
</sc-if>
</sc-for>
</ol>
</div>
<div class="map-ctrl">
<button type="button" class="btn btn--secondary btn--app" onClick="{{prevStage}}">Poprzedni etap</button>
<button type="button" class="btn btn--secondary btn--app" onClick="{{nextStage}}">Następny etap</button>
</div>
</sc-if>

<sc-if value="{{list}}" hint-placeholder-val="{{false}}">
<ol class="stoplist" aria-label="Lista przystanków">
<sc-for list="{{listItems}}" as="l" hint-placeholder-count="10">
<sc-if value="{{l.isStage}}" hint-placeholder-val="{{false}}"><li class="stoplist__stage">{{l.name}}</li></sc-if>
<sc-if value="{{l.isHere}}" hint-placeholder-val="{{false}}"><li><span class="blob blob--sm" aria-hidden="true"></span><strong>{{l.name}}</strong></li></sc-if>
<sc-if value="{{l.isAnd}}" hint-placeholder-val="{{false}}"><li class="stoplist__and">i</li></sc-if>
<sc-if value="{{l.isItem}}" hint-placeholder-val="{{true}}"><li><button type="button" class="link-btn" onClick="{{l.open}}">{{l.name}}</button><span class="badge {{l.badgeCls}}">{{l.status}}</span><span class="t-body">{{l.term}}</span></li></sc-if>
</sc-for>
</ol>
</sc-if>
</section>

<section class="stack" aria-labelledby="next-h">
<h2 class="t-h2" id="next-h">Najbliższa sprawa</h2>
<sc-if value="{{hasWez}}" hint-placeholder-val="{{false}}">
<div class="alert" role="region" aria-label="Pilne wezwanie">
<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2l6.5 12h-13z"/><path d="M8 6.5v3"/><path d="M8 12v.1"/></svg>
<span class="alert__title">Nowe pismo z ZUS</span><span aria-hidden="true">·</span><span>termin do 5 grudnia</span><span aria-hidden="true">·</span>
<button type="button" class="link-btn" onClick="{{openWez}}">Otwórz wezwanie</button>
</div>
</sc-if>
<button type="button" class="{{overlayCls}}" aria-label="Zamknij kartę przystanku" tabIndex="-1" onClick="{{closeSheet}}"></button>
<sc-if value="{{hasNext}}" hint-placeholder-val="{{true}}">
<article class="{{sheetCls}}" aria-labelledby="next-title">
<sc-if value="{{sheetOn}}" hint-placeholder-val="{{false}}"><button type="button" class="link-btn" style="justify-self: end" onClick="{{closeSheet}}">Zamknij</button></sc-if>
<p class="t-label">{{nx.forWho}}</p>
<h3 class="next__title" id="next-title" tabindex="-1">{{nx.title}}</h3>
<sc-if value="{{nx.hasLeft}}" hint-placeholder-val="{{false}}"><p class="next__left">{{nx.left}}</p></sc-if>
<div class="row"><span class="badge badge--todo">{{nx.status}}</span><sc-if value="{{nx.hasTo}}" hint-placeholder-val="{{false}}"><span class="t-body">{{nx.to}}</span></sc-if><sc-if value="{{nx.optional}}" hint-placeholder-val="{{false}}"><span class="badge badge--muted">Jeśli chcesz skorzystać</span></sc-if></div>
<p class="t-body">{{nx.why}}</p>
<sc-if value="{{nx.hasBase}}" hint-placeholder-val="{{false}}"><p class="t-body">{{nx.base}}</p></sc-if>
<sc-if value="{{nx.hasPrep}}" hint-placeholder-val="{{false}}">
<details class="card card--flat"><summary class="t-h4" style="cursor: pointer">Przygotuj</summary><ul class="list"><sc-for list="{{nx.prep}}" as="p" hint-placeholder-count="2"><li>{{p.t}}</li></sc-for></ul></details>
</sc-if>
<sc-if value="{{nx.hasHow}}" hint-placeholder-val="{{false}}">
<div class="stack-sm"><h4 class="t-h4">Jak złożyć</h4>
<dl class="howto"><sc-for list="{{nx.how}}" as="h" hint-placeholder-count="4"><div class="howto__row"><dt>{{h.k}}</dt><dd>{{h.val}}</dd></div></sc-for></dl></div>
</sc-if>
<sc-if value="{{nx.hasSrc}}" hint-placeholder-val="{{false}}"><p class="t-body">Źródło: <a class="link" href="{{nx.srcUrl}}" target="_blank" rel="noopener">{{nx.src}}</a></p></sc-if>
<sc-if value="{{nx.hasSrcText}}" hint-placeholder-val="{{false}}"><p class="t-body">Źródło: {{nx.src}}</p></sc-if>
<sc-if value="{{nx.isSamo}}" hint-placeholder-val="{{false}}"><p class="t-body"><strong>Nic nie musisz robić.</strong></p></sc-if>
<div class="btn-row">
<sc-if value="{{nx.hasAct}}" hint-placeholder-val="{{true}}"><button type="button" class="btn btn--app" onClick="{{nx.act}}">{{nx.actLabel}}</button></sc-if>
<sc-if value="{{nx.hasNoUse}}" hint-placeholder-val="{{false}}"><button type="button" class="link-btn" onClick="{{nx.noUse}}">Nie korzystam</button></sc-if>
<sc-if value="{{notNearest}}" hint-placeholder-val="{{false}}"><button type="button" class="link-btn" onClick="{{backNearest}}">Wróć do najbliższej sprawy</button></sc-if>
</div>
</article>
</sc-if>
<sc-if value="{{noNext}}" hint-placeholder-val="{{false}}">
<article class="card next"><h3 class="next__title">{{allDoneText}}</h3><p class="t-body">{{optText}}</p></article>
</sc-if>
</section>

<section class="card calc" aria-labelledby="calc-title">
<div class="page__head" style="order: 0">
<h2 class="t-h2" id="calc-title" tabindex="-1">Ile czasu i jaki zasiłek?</h2>
<p class="t-body">{{calcScope}}</p>
</div>
<div class="notice notice--warning" role="note" style="order: 1"><svg class="notice__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2l6.5 12h-13z"/><path d="M8 6.5v3"/><path d="M8 12v.1"/></svg><div class="stack-sm"><strong>Demonstracja kalkulatora</strong><span>Stawki 140 zł i 105 zł brutto dziennie to przykład ze specyfikacji, nie wyliczenie z Twoich danych. Liczymy tylko: dni × stawka dla dwóch odcinków urlopu rodzicielskiego oraz pulę tygodni.</span><span>Nie liczymy: sposobu wypłaty 81,5% lub 100%/70%, pracy na część etatu, urlopu uzupełniającego, kwoty minimalnej ani kwoty za urlop macierzyński i ojcowski.</span></div></div>
<div class="kpis" style="order: 1">
<div class="kpi"><span class="t-label">Czas opieki w kalendarzu</span><span class="kpi__v">{{kDays}}</span></div>
<div class="kpi"><span class="t-label">Szacowany zasiłek łącznie · brutto</span><span class="kpi__v">{{kTotal}}</span><span class="src" style="justify-self: start">Założenie do symulacji</span></div>
</div>
<sc-if value="{{hasB}}" hint-placeholder-val="{{false}}">
<div class="diff" role="status" style="order: 2"><p class="diff__head">{{diffHead}}</p><p class="t-body">{{diffSentence}}</p></div>
<div class="ab-switch" role="group" aria-label="Wariant A lub B" style="order: 3">
<sc-for list="{{abSwitch}}" as="a" hint-placeholder-count="2"><button type="button" class="btn btn--neutral btn--app tab" aria-pressed="{{a.pressed}}" onClick="{{a.pick}}">{{a.label}}</button></sc-for>
</div>
</sc-if>
<div class="{{variantsCls}}" style="order: 6">
<sc-for list="{{variants}}" as="vv" hint-placeholder-count="1">
<div class="variant" style="{{vv.style}}">
<div class="variant__head"><h3 class="t-h4">{{vv.title}}</h3><span class="t-body">{{vv.days}} · {{vv.total}}</span></div>
<div class="scale" aria-hidden="true"><sc-for list="{{vv.months}}" as="mo" hint-placeholder-count="4"><span>{{mo.m}}</span></sc-for></div>
<sc-for list="{{vv.tracks}}" as="t" hint-placeholder-count="2">
<div class="track"><span class="track__name">{{t.name}}</span><div class="track__lane" aria-hidden="true"><div class="{{t.segCls}}" style="{{t.segStyle}}"></div></div><span class="track__label">{{t.label}}</span></div>
</sc-for>
<div class="track"><span class="track__name">Urlop ojcowski · osobny tor</span>
<sc-if value="{{vv.hasOj}}" hint-placeholder-val="{{false}}"><div class="track__lane" aria-hidden="true"><div class="seg seg--o" style="{{vv.oj.segStyle}}"></div></div><span class="track__label">{{vv.oj.label}}</span></sc-if>
<sc-if value="{{vv.ojMissing}}" hint-placeholder-val="{{true}}"><span class="track__label">Data do ustalenia we wniosku o urlop ojcowski · nie zużywa puli</span></sc-if>
</div>
<ul class="segcards" aria-label="Odcinki wariantu">
<sc-for list="{{vv.cards}}" as="sc" hint-placeholder-count="2"><li class="{{sc.cls}}" id="{{sc.id}}" tabindex="-1"><span>{{sc.t}}</span><sc-if value="{{sc.hasErr}}" hint-placeholder-val="{{false}}"><p class="field-message"><svg class="field-message__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="3"/><path d="M8 5v3.5M8 11v.1"/></svg>{{sc.err}}</p></sc-if></li></sc-for>
</ul>
</div>
</sc-for>
</div>
<div class="{{pool.cls}}" style="order: 7">
<button type="button" class="pool__head" aria-expanded="{{poolExp}}" aria-controls="pool-body" onClick="{{togglePool}}">
<span class="pool__state">
<sc-if value="{{pool.isLeft}}" hint-placeholder-val="{{true}}"><svg class="ic-lg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="3"/><path d="M8 7v4M8 4.8v.1"/></svg></sc-if>
<sc-if value="{{pool.isFull}}" hint-placeholder-val="{{false}}"><svg class="ic-lg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg></sc-if>
<sc-if value="{{pool.isOver}}" hint-placeholder-val="{{false}}"><svg class="ic-lg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="3"/><path d="M8 5v3.5M8 11v.1"/></svg></sc-if>
{{pool.title}}</span>
<svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg>
</button>
<sc-if value="{{pool.isOver}}" hint-placeholder-val="{{false}}"><div class="pool__err"><button type="button" class="link-btn" onClick="{{goPoolErr}}">Przejdź do odcinka z błędem</button></div></sc-if>
<sc-if value="{{poolOpen}}" hint-placeholder-val="{{false}}">
<div class="pool__body" id="pool-body">
<sc-for list="{{pool.rows}}" as="pr" hint-placeholder-count="3">
<div class="stack-sm"><div class="row-between"><strong>{{pr.label}}</strong><span>{{pr.val}}</span></div><div class="meter" aria-hidden="true"><div class="{{pr.cls}}" style="{{pr.w}}"></div></div></div>
</sc-for>
<p class="t-body">{{pool.total}}</p>
</div>
</sc-if>
</div>
<div class="assume" style="order: 8">
<button type="button" class="disclosure" aria-expanded="{{assumeExp}}" aria-controls="assume-body" onClick="{{toggleAssume}}"><span>{{assumeText}} · <span style="color: var(--color-text-link)">zmień</span></span><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button>
<sc-if value="{{assumeOpen}}" hint-placeholder-val="{{false}}">
<div class="stack" id="assume-body" style="padding-bottom: var(--space-sm)">
<div class="seg-ctrl" role="group" aria-label="Liczba dzieci"><sc-for list="{{kidsOpts}}" as="o" hint-placeholder-count="2"><button type="button" class="btn btn--neutral btn--app tab btn--sm" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div>
<div class="seg-ctrl" role="group" aria-label="Za życiem"><sc-for list="{{zzOpts}}" as="o" hint-placeholder-count="2"><button type="button" class="btn btn--neutral btn--app tab btn--sm" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div>
<p class="t-body">Hospitalizacja i wcześniactwo: w tym demo nie liczymy urlopu uzupełniającego.</p>
</div>
</sc-if>
</div>
<div class="stack-sm" style="order: 9">
<span class="t-label">Sposób wypłaty</span>
<p class="t-body">81,5% przez cały okres albo 100%, potem 70%. Wniosek o 81,5% składa się do 21 dni po porodzie. <strong>W tym demo nie przeliczamy kwot według sposobu wypłaty</strong>, bo przykładowe stawki dzienne są stałe.</p>
</div>
<div class="stack" style="order: 10">
<div class="btn-row">
<button type="button" class="btn btn--secondary btn--app" aria-expanded="{{calcEditExp}}" aria-controls="calc-edit" onClick="{{toggleEdit}}">Zmień wariant</button>
<button type="button" class="btn btn--secondary btn--app" onClick="{{compare}}">{{compareLabel}}</button>
<button type="button" class="link-btn" aria-expanded="{{whyExp}}" aria-controls="calc-why" onClick="{{toggleWhy}}">Skąd ta kwota?</button>
<button type="button" class="link-btn" onClick="{{askCalc}}">Zapytaj Zusika</button>
</div>
<sc-if value="{{calcEdit}}" hint-placeholder-val="{{false}}">
<div class="card card--flat stack" id="calc-edit">
<p class="t-h4">{{editKey}}</p>

<div class="sum__row"><dt class="sum__label">Imię i nazwisko</dt><dd class="sum__value">Joanna Przykładowa</dd><dd class="sum__src"><span class="src" aria-hidden="true"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="10" height="7" rx="2"/><path d="M5 7V5a3 3 0 0 1 6 0v2"/></svg>login.gov.pl · symulacja</span><span class="sr">Dane z logowania, nie do edycji</span></dd><dd class="sum__act"></dd></div>

<section class="card stack" aria-labelledby="zus-h"><h2 class="t-h3" id="zus-h">Moje konto w ZUS (symulacja eZUS)</h2>

<div class="sum__row"><dt class="sum__label">Członkowie rodziny zgłoszeni do ubezpieczenia zdrowotnego</dt><dd class="sum__value">Brak danych</dd><dd class="sum__src"><span class="src">ZUS · symulacja</span></dd><dd class="sum__act"></dd></div>
<div class="sum__row"><dt class="sum__label">e-ZLA i przyznane świadczenia</dt><dd class="sum__value">[DO USTALENIA: dane symulacji eZUS]</dd><dd class="sum__src"><span class="src">ZUS · symulacja</span></dd><dd class="sum__act"></dd></div>
<div class="sum__row"><dt class="sum__label">Zadłużenie składkowe</dt><dd class="sum__value">Nie dotyczy przy umowie o pracę</dd><dd class="sum__src"><span class="src">ZUS · symulacja</span></dd><dd class="sum__act"></dd></div>

<sc-if value="{{askErr}}" hint-placeholder-val="{{false}}"><p class="field-message" id="ask-err"><svg class="field-message__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="3"/><path d="M8 5v3.5M8 11v.1"/></svg>Wpisz treść wiadomości.</p></sc-if>

</div>
</section>
<section class="card card--info stack" aria-labelledby="test-h"><h2 class="t-h3" id="test-h">Przetestuj przykładową sprawę</h2>

<!-- ======================= SPRAWA TESTOWA (S12) ======================= -->
<sc-if value="{{isTest}}" hint-placeholder-val="{{false}}">
<div class="wrap page">
<div class="page__head">
<button type="button" class="link-btn back" onClick="{{tBack}}">{{tBackLabel}}</button>
<div class="row"><h1 class="t-page" data-focus-title="1" tabindex="-1">Przetestuj przykładową sprawę</h1><span class="badge badge--test">Test</span></div>
</div>
<ol class="steps" aria-label="Kroki">
<sc-for list="{{tSteps}}" as="s" hint-placeholder-count="3"><li><button type="button" class="btn btn--neutral btn--app tab btn--sm" aria-current="{{s.cur}}" aria-pressed="{{s.pressed}}" disabled="{{s.dis}}" onClick="{{s.go}}">{{s.label}}</button></li></sc-for>
</ol>
<sc-if value="{{t1}}" hint-placeholder-val="{{true}}">
<section class="card stack" aria-labelledby="t1-h"><h2 class="t-h3" id="t1-h">Wgraj PDF</h2>
<p class="t-body">W publicznym demo tylko wgrywanie pliku. Dokumenty ZUS nie są rozpowszechniane.</p>
<label class="field-label" for="t-file">Plik PDF ze sprawą testową</label>
<input id="t-file" type="file" accept="application/pdf" onChange="{{tPick}}">
<sc-if value="{{tHasFile}}" hint-placeholder-val="{{false}}"><p class="t-body">Wybrany plik: {{tFile}}</p></sc-if>
<sc-if value="{{tLoading}}" hint-placeholder-val="{{false}}"><div class="loading" role="status"><span class="blob blob--sm" aria-hidden="true"></span>Wczytujemy dokumenty…</div></sc-if>
<sc-if value="{{tConfirm}}" hint-placeholder-val="{{false}}"><div class="notice notice--warning" role="alert"><svg class="notice__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2l6.5 12h-13z"/><path d="M8 6.5v3"/><path d="M8 12v.1"/></svg><div class="stack-sm"><span>Podmienić plik? Twoje poprawki w danych zostaną utracone.</span><div class="btn-row"><button type="button" class="btn btn--secondary btn--app" onClick="{{tReplace}}">Podmień plik</button><button type="button" class="link-btn" onClick="{{tKeep}}">Zostaw obecny</button></div></div></div></sc-if>
</section>
</sc-if>
<sc-if value="{{t2}}" hint-placeholder-val="{{false}}">
<section class="card stack" aria-labelledby="t2-h"><h2 class="t-h3" id="t2-h">Sprawdź dane</h2>
<p class="t-body">Odczyt z pliku {{tFile}}. Każde pole możesz poprawić przed wyliczeniem.</p>
<dl class="sum">
<sc-for list="{{tFields}}" as="tf" hint-placeholder-count="3">
<div class="sum__row"><dt class="sum__label">{{tf.label}}</dt><dd class="sum__value">{{tf.val}}</dd>
<dd class="sum__src"><span class="badge badge--ai">AI</span><sc-if value="{{tf.src}}" hint-placeholder-val="{{true}}"><span class="src">{{tf.src}}</span></sc-if></dd>
<dd class="sum__act"><button type="button" class="link-btn" onClick="{{tf.open}}">{{tf.btn}}<span class="sr">: {{tf.label}}</span></button></dd>
<sc-if value="{{tf.editing}}" hint-placeholder-val="{{false}}"><dd class="inline-edit" style="grid-column: 1 / -1"><label class="field-label" for="{{tf.id}}">{{tf.label}}</label><div class="field field--wide"><input class="field__input" id="{{tf.id}}" type="text" value="{{tf.edVal}}" onChange="{{tf.onEd}}"></div><div class="btn-row"><button type="button" class="btn btn--secondary btn--app" onClick="{{tf.save}}">Zapisz</button><button type="button" class="link-btn" onClick="{{tf.cancel}}">Anuluj</button></div></dd></sc-if>
</div>
</sc-for>
</dl>
<div class="ob__foot"><button type="button" class="btn btn--app" disabled="{{tNextDisabled}}" onClick="{{tToResult}}">Dalej</button></div>
</section>
</sc-if>
<sc-if value="{{t3}}" hint-placeholder-val="{{false}}">
<section class="stack-lg" aria-labelledby="t3-h"><h2 class="sr" id="t3-h">Wynik</h2>
<sc-if value="{{tMatch}}" hint-placeholder-val="{{true}}"><div class="notice notice--success"><svg class="notice__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg><strong>Zgodne z decyzją ZUS</strong></div></sc-if>
<sc-if value="{{tNoMatch}}" hint-placeholder-val="{{false}}"><div class="notice notice--warning"><svg class="notice__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2l6.5 12h-13z"/><path d="M8 6.5v3"/><path d="M8 12v.1"/></svg><strong>{{tDiff}}</strong></div></sc-if>
<dl class="howto">
<div class="howto__row"><dt>Ubezpieczenie</dt><dd>{{tIns}}</dd></div>
<div class="howto__row"><dt>Prawo do świadczenia</dt><dd>{{tRight}}</dd></div>
<div class="howto__row"><dt>Okres i kwota</dt><dd>{{tAmount}} <span class="src">symulacja</span></dd></div>
</dl>
<div class="btn-row"><button type="button" class="btn btn--app" onClick="{{tOpenPlan}}">Otwórz jako plan</button><button type="button" class="btn btn--secondary btn--app" onClick="{{tAnother}}">Wczytaj inną sprawę</button></div>
</section>
</sc-if>
</div>
</sc-if>

<!-- ======================= ZUSIK (S13) ======================= -->

<div class="row-between">
<div class="row"><span class="blob blob--sm" aria-hidden="true"></span><h2 class="zp__title" id="zp-title" tabindex="-1">Zusik · asystent AI</h2><span class="badge badge--ai">AI</span></div>

</div>
<p class="zp__ctx">{{zpCtx}}</p>
<div class="zp__tools">
<button type="button" class="btn btn--neutral btn--app tab" aria-pressed="{{histOpen}}" onClick="{{toggleHist}}">Historia</button>
<button type="button" class="btn btn--neutral btn--app" onClick="{{newConv}}">Nowa rozmowa</button>
<button type="button" class="btn btn--neutral btn--app" onClick="{{toggleFull}}">{{zpFullLabel}}</button>
<sc-if value="{{isOjcKey}}" hint-placeholder-val="{{false}}"><button type="button" class="btn btn--neutral btn--app tab" aria-pressed="{{failNext}}" onClick="{{toggleFail}}">Demo: błąd zapisu</button></sc-if>
</div>
</div>
<sc-if value="{{fragOjc}}" hint-placeholder-val="{{false}}"><div class="zp__frag"><dl class="sum"><div class="{{fragCls}}"><dt class="sum__label">Początek urlopu</dt><dd class="sum__value">{{fragStart}}</dd><dd class="sum__src"><sc-if value="{{fragHl}}" hint-placeholder-val="{{false}}"><span class="changed-note"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>Zaktualizowano</span></sc-if></dd></div></dl></div></sc-if>
<sc-if value="{{fragMac}}" hint-placeholder-val="{{false}}"><div class="zp__frag stack-sm"><span class="t-body">{{fragAtt}}</span><sc-if value="{{fragCanAttach}}" hint-placeholder-val="{{false}}"><div><button type="button" class="btn btn--secondary btn--app btn--sm" onClick="{{fragAttach}}">Dodaj z Plików dziecka: Zaświadczenie ze szpitala.pdf</button></div></sc-if></div></sc-if>
<div class="zp__body">

<sc-for list="{{histItems}}" as="h" hint-placeholder-count="2"><button type="button" class="starter" aria-current="{{h.cur}}" onClick="{{h.pick}}"><strong>{{h.title}}</strong> · {{h.time}}<br><span class="t-body">{{h.sub}}</span></button></sc-for>

</sc-if>
<sc-for list="{{msgs}}" as="m" hint-placeholder-count="2">

<div class="stack-sm">
<sc-if value="{{m.hasOk}}" hint-placeholder-val="{{false}}"><span class="msg__ok msg__text"><svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3 3 7-7"/></svg>{{m.ok}}</span></sc-if>
<sc-if value="{{m.hasAnnot}}" hint-placeholder-val="{{false}}"><div class="annot"><button type="button" class="link-btn" onClick="{{m.goField}}">{{m.annot.field}} ↗</button><span class="t-body">{{m.annotLine}}</span><span class="t-body">{{m.annot.where}}</span></div></sc-if>
<sc-if value="{{m.hasText}}" hint-placeholder-val="{{true}}"><p class="msg__text">{{m.text}}</p></sc-if>
<sc-if value="{{m.hasSaveErr}}" hint-placeholder-val="{{false}}"><div class="save-err" role="alert"><p class="field-message"><svg class="field-message__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="3"/><path d="M8 5v3.5M8 11v.1"/></svg>Zapis się nie powiódł.</p><span class="t-body">{{m.curVal}}</span><div><button type="button" class="btn btn--secondary btn--app btn--sm" disabled="{{m.retryBusy}}" onClick="{{m.retry}}">{{m.retryLabel}}</button></div></div></sc-if>
<sc-if value="{{m.hasErr}}" hint-placeholder-val="{{false}}"><p class="field-message"><svg class="field-message__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="3"/><path d="M8 5v3.5M8 11v.1"/></svg>{{m.err}}</p></sc-if>
<sc-if value="{{m.hasCite}}" hint-placeholder-val="{{false}}"><div class="cite"><button type="button" class="link-btn" aria-expanded="{{m.citeExp}}" onClick="{{m.toggleCite}}">{{m.cite.label}}</button><sc-if value="{{m.citeOpen}}" hint-placeholder-val="{{false}}"><blockquote class="cite__q">„{{m.cite.quote}}”<br><span class="t-body">{{m.cite.srcName}}</span></blockquote></sc-if></div></sc-if>

/* Mini-runtime eksportu: wykonuje ten sam szablon (sc-if, sc-for, {{dziury}}, on*) i tę samą klasę Component,
   co artboard w Claude Design. Renderowanie przez porównanie z istniejącym DOM, więc fokus i przewinięcie zostają. */
(function () {
  var root, tpl, inst, scheduled = false, prevState = null, cbs = [];
  var HOLE = /\{\{\s*([\w$.]+)\s*\}\}/g, WHOLE = /^\{\{\s*([\w$.]+)\s*\}\}$/;
  var BOOL = { disabled: 1, readonly: 1, hidden: 1, checked: 1, required: 1 };

  function look(scope, path) {
    if (path === 'true') return true; if (path === 'false') return false;
    if (/^-?\d+(\.\d+)?$/.test(path)) return +path;
    var parts = path.split('.'), v = scope;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(s, scope) { return s.replace(HOLE, function (_, p) { var v = look(scope, p); return v == null ? '' : String(v); }); }

  function DCLogic(props) { this.props = props || {}; this.state = {}; }
  DCLogic.prototype.setState = function (p, cb) {
    if (!prevState) prevState = this.state;
    var patch = typeof p === 'function' ? p(this.state, this.props) : p;
    this.state = Object.assign({}, this.state, patch);
    if (cb) cbs.push(cb);
    schedule();
  };
  DCLogic.prototype.forceUpdate = function (cb) { if (!prevState) prevState = this.state; if (cb) cbs.push(cb); schedule(); };
  window.DCLogic = DCLogic;

  function schedule() { if (scheduled) return; scheduled = true; Promise.resolve().then(flush); }
  function flush() {
    scheduled = false;
    var ps = prevState; prevState = null;
    render();
    if (inst.componentDidUpdate) inst.componentDidUpdate(inst.props, ps || inst.state);
    var list = cbs; cbs = [];

  }

  function build(nodes, scope, out, ns) {
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (n.nodeType === 3) { out.push(document.createTextNode(interp(n.data, scope))); continue; }
      if (n.nodeType !== 1) continue;
      var tag = n.localName;
      if (tag === 'sc-if') { if (look(scope, (n.getAttribute('value') || '').replace(/[{}\s]/g, ''))) build(n.childNodes, scope, out, ns); continue; }
      if (tag === 'sc-for') {
        var list = look(scope, (n.getAttribute('list') || '').replace(/[{}\s]/g, '')) || [], as = n.getAttribute('as');
        for (var j = 0; j < list.length; j++) { var s = Object.create(scope); s[as] = list[j]; s.$index = j; build(n.childNodes, s, out, ns); }
        continue;
      }
      var el = document.createElementNS(n.namespaceURI, tag);
      el.__h = {};
      for (var a = 0; a < n.attributes.length; a++) {
        var at = n.attributes[a], name = at.name, val = at.value, m = val.match(WHOLE);
        if (name.indexOf('hint-') === 0) continue;
        if (name.slice(0, 2) === 'on' && m) {
          var ev = name.slice(2).toLowerCase();
          if (ev === 'change' && (tag === 'textarea' || (tag === 'input' && n.getAttribute('type') !== 'file'))) ev = 'input';
          el.__h[ev] = look(scope, m[1]); continue;
        }
        if (name === 'value' && (tag === 'input' || tag === 'textarea')) { el.__val = m ? (look(scope, m[1]) == null ? '' : String(look(scope, m[1]))) : interp(val, scope); continue; }
        if (m) {
          var raw = look(scope, m[1]);
          if (raw === false || raw == null) continue;
          if (raw === true) { el.setAttribute(name, ''); continue; }
          if (BOOL[name] && (raw === 'false' || raw === '')) continue;
          el.setAttribute(name, String(raw));
        } else el.setAttribute(name, interp(val, scope));
      }
      var kids = [];
      build(n.childNodes, scope, kids, n.namespaceURI);
      for (var k = 0; k < kids.length; k++) el.appendChild(kids[k]);
      out.push(el);
    }
  }

  function bind(el) {
    if (el.nodeType !== 1) return;
    if (el.__h) {
      el.__reg = el.__reg || {};
      Object.keys(el.__h).forEach(function (t) {
        if (el.__reg[t]) return;
        el.__reg[t] = true;
        el.addEventListener(t, function (e) { var f = el.__h && el.__h[t]; if (f) f(e); });
      });
    }
    if (el.__val !== undefined && el.type !== 'file' && el.value !== el.__val) el.value = el.__val;
    for (var c = el.firstChild; c; c = c.nextSibling) bind(c);
  }

  function morph(live, fresh) {
    var la = live.attributes, i;
    for (i = la.length - 1; i >= 0; i--) if (!fresh.hasAttribute(la[i].name)) live.removeAttribute(la[i].name);
    var fa = fresh.attributes;
    for (i = 0; i < fa.length; i++) if (live.getAttribute(fa[i].name) !== fa[i].value) live.setAttribute(fa[i].name, fa[i].value);
    live.__h = fresh.__h; live.__val = fresh.__val;
    if (live.__val !== undefined && live.type !== 'file' && live.value !== live.__val) live.value = live.__val;
    live.__reg = live.__reg || {};
    Object.keys(live.__h || {}).forEach(function (t) { if (!live.__reg[t]) { live.__reg[t] = true; live.addEventListener(t, function (e) { var f = live.__h && live.__h[t]; if (f) f(e); }); } });
    morphKids(live, Array.prototype.slice.call(fresh.childNodes));
  }
  function morphKids(parent, fc) {
    var lc = Array.prototype.slice.call(parent.childNodes);
    for (var i = 0; i < fc.length; i++) {
      var l = lc[i], f = fc[i];
      if (!l) { parent.appendChild(f); bind(f); continue; }
      if (l.nodeType === 3 && f.nodeType === 3) { if (l.data !== f.data) l.data = f.data; continue; }
      if (l.nodeType === 1 && f.nodeType === 1 && l.localName === f.localName && l.namespaceURI === f.namespaceURI && (l.localName !== 'input' || l.type === f.getAttribute('type') || !f.getAttribute('type'))) { morph(l, f); continue; }
      parent.replaceChild(f, l); bind(f);
    }
    for (var j = fc.length; j < lc.length; j++) parent.removeChild(lc[j]);
  }

  function render() {
    var vals = inst.renderVals();
    var out = [];
    build(tpl.childNodes, vals, out, null);
    morphKids(root, out);
  }

  window.mountDC = function (Cls, rootEl, tplEl, props) {
    root = rootEl; tpl = tplEl.content;
    inst = new Cls(props || {});
    render();
    if (inst.componentDidMount) inst.componentDidMount();
  };
})();

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      entered: false,
      ob: { step: 'start', who: null, child: null, role: null, d: { day: '', month: '', year: '' }, dTried: false, dLater: false, count: null, name: '', job: null, startOpen: false, whyOpen: false, ret: null, nameSaved: false },
      plan: 'ola', example: false, regNote: null,
      view: 'plan', caseId: null, from: null,
      list: false, selStop: null, sheet: false, selOpen: false, showNow: false, bannerStage: null,
      store: {}, resumed: false,
      docs: { tab: 'cases', filter: null },
      zp: { open: false, key: 'plan', full: false, hist: false, gen: false, model: 'PLLuM', modelOpen: false, cal: false, calY: 2027, calM: 5, stopNote: null, w: 50, failNext: false },
      prof: { fetched: '21 listopada 2026, 9:00', refreshing: false, ask: '', askErr: false, asked: [] },
      test: { step: 1, file: null, loading: false, confirm: false, fields: { podstawa: '6812,40', tytul: 'Umowa o pracę', porod: '' }, edit: null, edVal: '', opened: false, maxStep: 1 },
      live: ''

    Object.assign(this.state, Component.defaults('ola'));
    this.onWin = this.onWin.bind(this);
    this.timer = null;
  }

  componentDidMount() { var self = this;
    try { var raw = window.localStorage.getItem(Component.OBKEY()); if (raw) { var sv = JSON.parse(raw); if (sv && sv.ob && sv.ob.step && sv.ob.step !== 'start') this.setState({ ob: Object.assign({}, this.state.ob, sv.ob, { whyOpen: false }), resumed: true, live: 'Wznowiono od ostatniego pytania' }); } } catch (e) {}
    this.onResize = function () { clearTimeout(self.rt); self.rt = setTimeout(function () { self.centerPion(false); self.onWin(); }, 120); }; try { window.addEventListener('scroll', this.onWin, { passive: true }); window.addEventListener('resize', this.onResize); } catch (e) {} }

  componentDidUpdate(pp, ps) {
    var st = this.state;
    if (ps.ob !== st.ob || ps.entered !== st.entered) this.saveOb();
    var moved = ps.view !== st.view || ps.caseId !== st.caseId || ps.entered !== st.entered || ps.ob.step !== st.ob.step || ps.plan !== st.plan || ps.test.step !== st.test.step;
    if (moved) {
      try { window.scrollTo(0, 0); } catch (e) {}
      var h = document.querySelector('[data-focus-title]');
      if (h) h.focus({ preventScroll: true });
      if (st.entered && st.view === 'plan') this.centerSoon = true;
    }
    if (this.centerSoon) { this.centerSoon = false; var self = this; setTimeout(function () { self.centerPion(false); }, 30); }
    if (!ps.zp.open && st.zp.open) { var t = document.querySelector('.zp__title'); if (t) t.focus(); }
    if (ps.zp.open && !st.zp.open) {
      var o = this.opener; this.opener = null;
      if (o && document.body.contains(o)) o.focus(); else { var f = document.querySelector('.fab, .pion'); if (f) f.focus(); }
    }

  }

  /* ---------- dane planu: każdy plan ma własny magazyn (plan przykładowy nie zmienia planu Oli) ---------- */
  static dataKeys() { return ['uscDone', 'ticks', 'zdrDone', 'ojc', 'mac', 'calc', 'karta', 'kartaEd', 'convs', 'drafts', 'atts', 'citeOpen', 'flagOpen']; }
  static defaults(p) {
    return {
      uscDone: false, ticks: {}, zdrDone: false,
      ojc: { start: null, prev: null, status: 'szkic', hl: false, edit: false, ed: { day: '', month: '', year: '' }, edTried: false, ver: 0 },
      mac: { attached: false, sent: false, pick: false, upp: false, orig: false },
      calc: { A: { mode: 'seq', d1: 28, d2: 28 }, B: null, sel: 'A', edit: false, whyOpen: false, assumeOpen: false, kids: 1, zz: false, applied: null, poolOpen: false, err: null, saved: null },
      karta: p === 'ola' ? new Date(2026, 10, 10) : null,
      kartaEd: { open: false, v: { day: '', month: '', year: '' }, tried: false },
      convs: {}, drafts: {}, atts: {}, citeOpen: {}, flagOpen: {}
    };
  }
  switchPlan(p, extra) {
    this.setState(function (prev) {
      var o = Object.assign({}, extra || {});
      if (prev.plan !== p) {
        var store = Object.assign({}, prev.store), cur = {};
        Component.dataKeys().forEach(function (k) { cur[k] = prev[k]; });
        store[prev.plan] = cur;
        Object.assign(o, store[p] || Component.defaults(p), { store: store, plan: p, selStop: null, zp: Object.assign({}, prev.zp, { open: false, hist: false, cal: false }) });
        if (prev.view === 'case' && !('view' in o)) { o.view = 'plan'; o.caseId = null; o.from = null; }
      }
      return o;
    });
  }

  /* ---------- pamięć demonstracji: wznowienie przerwanego onboardingu ---------- */
  static OBKEY() { return 'przewodnik-rodzica-demo-onboarding-v1'; }
  saveOb() {
    try {
      var st = this.state;
      if (st.entered || st.ob.step === 'start') window.localStorage.removeItem(Component.OBKEY());
      else window.localStorage.setItem(Component.OBKEY(), JSON.stringify({ ob: st.ob, at: Date.now() }));
    } catch (e) {}
  }
  resetOb() {
    try { window.localStorage.removeItem(Component.OBKEY()); } catch (e) {}
    this.setState({ resumed: false, live: 'Zaczynamy od nowa' });
    this.set('ob', { step: 'start', who: null, child: null, role: null, d: { day: '', month: '', year: '' }, dTried: false, dLater: false, count: null, name: '', job: null, ret: null, nameSaved: false, whyOpen: false });
  }

  /* ---------- pomocnicze ---------- */
  say(msg) { this.setState({ live: msg }); }
  set(part, patch, cb) { this.setState(function (prev) { var o = {}; o[part] = Object.assign({}, prev[part], patch); return o; }, cb); }

  onWin() {
    var st = this.state;
    if (!st.entered || st.view !== 'plan') return;
    var p = document.querySelector('.pion');
    var show = false;
    if (p && !st.list) {
      var r = p.getBoundingClientRect(), vh = window.innerHeight || 800, vw = window.innerWidth || 1280;
      show = r.bottom < 0 || r.top > vh || r.right < 0 || r.left > vw;
      var wrap = document.querySelector('.path-wrap');
      if (wrap && !show) { var w = wrap.getBoundingClientRect(); if (r.right < w.left || r.left > w.right) show = true; }
    }
    var heads = document.querySelectorAll('[data-stage]'), cur = null;
    var top = 140;
    for (var i = 0; i < heads.length; i++) { if (heads[i].getBoundingClientRect().top <= top) cur = +heads[i].getAttribute('data-stage'); }
    var patch = {};
    if (show !== st.showNow) patch.showNow = show;
    if (cur !== st.bannerStage) patch.bannerStage = cur;
    if (Object.keys(patch).length) this.setState(patch);
  }

  centerPion(focus) {
    var p = document.querySelector('.pion');
    if (!p) return;
    var wrap = document.querySelector('.path-wrap');
    if (wrap && wrap.scrollWidth > wrap.clientWidth + 2) {
      var pr = p.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
      wrap.scrollLeft += (pr.left - wr.left) - wr.width / 2 + pr.width / 2;
    } else if (focus) {
      try { p.scrollIntoView({ block: 'center' }); } catch (e) {}
    }
    if (focus) p.focus({ preventScroll: true });
  }

  /* ---------- daty ---------- */
  static M() { return ['stycznia', 'lutego', 'marca', 'kwietnia', 'maja', 'czerwca', 'lipca', 'sierpnia', 'września', 'października', 'listopada', 'grudnia']; }
  static MN() { return ['styczeń', 'luty', 'marzec', 'kwiecień', 'maj', 'czerwiec', 'lipiec', 'sierpień', 'wrzesień', 'październik', 'listopad', 'grudzień']; }
  static add(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  static fmt(d, noYear) { return d.getDate() + ' ' + Component.M()[d.getMonth()] + (noYear ? '' : ' ' + d.getFullYear()); }
  static short(d) { return ('0' + d.getDate()).slice(-2) + '.' + ('0' + (d.getMonth() + 1)).slice(-2); }
  static days(a, b) { return Math.round((b.getTime() - a.getTime()) / 86400000); }
  static money(n) { var s = String(Math.round(n * 100) / 100); var parts = s.split('.'); parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' '); return parts[0] + (parts[1] ? ',' + (parts[1] + '0').slice(0, 2) : '') + ' zł'; }
  static parseD(o) {
    if (!o.day || !o.month || !o.year) return { empty: true };
    var ok = /^\d{1,2}$/.test(o.day) && /^\d{1,2}$/.test(o.month) && /^\d{4}$/.test(o.year);
    var D = +o.day, M = +o.month, Y = +o.year;
    if (ok) ok = M >= 1 && M <= 12 && D >= 1 && D <= new Date(Y, M, 0).getDate();
    return ok ? { date: new Date(Y, M - 1, D) } : { invalid: true };
  }
  static gen(name) {
    var n = (name || '').trim(); if (!n) return '';
    if (/ia$/i.test(n)) return n.slice(0, -1);
    if (/[lkgj]a$/i.test(n)) return n.slice(0, -1) + 'i';
    if (/a$/i.test(n)) return n.slice(0, -1) + 'y';
    return '„' + n + '”';
  }
  static plural(n, a, b, c) { if (n === 1) return a; var m10 = n % 10, m100 = n % 100; return (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) ? b : c; }

  /* ---------- onboarding ---------- */
  obSteps(ob) {
    var s = ['who'];
    if (!ob.who) return s;
    s.push('role');
    if (ob.who !== 'plan' && ob.child !== 'ola') s.push('date');
    if ((ob.who === 'expect' || ob.who === 'born') && ob.child !== 'ola') s.push('count');
    if (ob.child !== 'ola') s.push('name');
    if (ob.who !== 'born' && ob.child !== 'ola') s.push('job');
    return s;
  }
  obNext() {
    var ob = this.state.ob, steps = this.obSteps(ob), i = steps.indexOf(ob.step);
    if (ob.ret === 'summary' || ob.ret === 'profile') {
      if (ob.step === 'who' && steps.length > 1 && !ob.role) { this.set('ob', { step: 'role' }); return; }
      if (ob.ret === 'profile') { this.set('ob', { step: 'summary', ret: null }); this.setState({ entered: true, view: 'profile' }); return; }
      this.set('ob', { step: 'summary', ret: null }); return;
    }
    var next = steps[i + 1] || 'summary';
    this.set('ob', { step: next, nameSaved: ob.step === 'name' && !!ob.name.trim() });
  }
  obBack() {
    var ob = this.state.ob;
    if (ob.ret) { var r = ob.ret; this.set('ob', { step: 'summary', ret: null }); if (r === 'profile') this.setState({ entered: true, view: 'profile' }); return; }
    var steps = this.obSteps(ob), i = steps.indexOf(ob.step);
    if (ob.step === 'summary') { this.set('ob', { step: steps[steps.length - 1] }); return; }
    if (i <= 0) { this.set('ob', { step: 'start' }); return; }
    this.set('ob', { step: steps[i - 1] });
  }
  roles(who) {
    return ({
      plan: ['Planuję ciążę', 'Jestem drugim rodzicem'],
      expect: ['Jestem w ciąży', 'Jestem drugim rodzicem'],
      born: ['Urodziłam dziecko', 'Jestem drugim rodzicem'],
      adopt: ['Przysposabiam dziecko', 'Jestem drugim opiekunem'],
      foster: ['Przyjmuję dziecko do rodziny zastępczej', 'Jestem drugim opiekunem']
    })[who] || [];
  }
  finishOb() {
    var ob = this.state.ob, plan = 'ola', regNote = null, example = false;
    if (ob.who === 'expect' || ob.who === 'plan') plan = 'expected';
    if (ob.who === 'adopt' || ob.who === 'foster') plan = 'adopt';
    if (ob.who === 'born' && ob.child !== 'ola') {
      var p = Component.parseD(ob.d);
      if (p.date && Component.days(new Date(2026, 10, 10), p.date) !== 0) regNote = 'Zaktualizowano z rejestru: ' + Component.fmt(p.date) + ' → 10 listopada 2026';
    }
    this.switchPlan(plan, { entered: true, example: example, regNote: regNote, view: 'plan', caseId: null, selStop: null, list: false, resumed: false, live: 'Otwarto Mój plan' });
  }

  /* ---------- dane planów ---------- */
  buildPlan() {
    var st = this.state, C = Component, BIRTH = new Date(2026, 10, 10), DEMO = new Date(2026, 10, 21);

  parseChatDate(t) {
    var M = Component.M(), m = t.match(/(\d{1,2})[.\-/](\d{1,2})[.\-/](\d{4})/);
    if (m) { var p = Component.parseD({ day: m[1], month: m[2], year: m[3] }); return p.date ? { date: p.date } : { bad: true }; }
    var re = new RegExp('(\\d{1,2})\\s+(' + M.join('|') + ')(?:\\s+(\\d{4}))?', 'i');
    m = t.match(re);
    if (m) {
      if (!m[3]) return { noYear: true, d: +m[1], m: M.indexOf(m[2].toLowerCase()) };
      var p2 = Component.parseD({ day: m[1], month: String(M.indexOf(m[2].toLowerCase()) + 1), year: m[3] });
      return p2.date ? { date: p2.date } : { bad: true };
    }
    return null;
  }

      v.openFab = function (e) { var kmap = { docs: 'docs', profile: 'profile', test: 'profile', support: 'plan', case: (st.caseId === 'ojc' ? 'ojc' : (st.caseId === 'mac' ? 'mac' : 'docs')) }; self.openZp(kmap[st.view] || 'plan', e.currentTarget); };
      v.inviteText = st.caseId === 'mac' ? 'Chcesz uzupełnić odpowiedź z Zusikiem?' : 'Chcesz wypełnić ten wniosek z Zusikiem?';
      v.openInvite = function (e) { self.openZp(st.caseId === 'mac' ? 'mac' : 'ojc', e.currentTarget); };

      /* wsparcie */
      v.supportBack = function () { var f2 = self.state.from; if (f2 && f2.view === 'ob') { self.switchPlan('ola', { entered: false, view: 'plan', from: null, example: false }); return; } self.goTab('plan'); };
      v.supportBackLabel = st.from && st.from.view === 'ob' ? '← Wróć do pytań' : '← Wróć do planu';
      v.openSupport = function () { self.setState({ view: 'support', from: { view: 'plan' } }); };
    }
    if (!v.appCls) v.appCls = 'app';
    if (!v.appStyle) v.appStyle = 'font-family: var(--font-ui); color: var(--color-text-strong)';
    if (!v.nx) v.nx = { prep: [], how: [] };
    return v;
  }

  isPhoneWidth() { var a = document.querySelector('.app'); return a ? a.getBoundingClientRect().width < 768 : false; }
}

mountDC(Component, document.getElementById('root'), document.getElementById('tpl'), {});
</script>

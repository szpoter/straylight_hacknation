components:
  securitySchemes:
    demoSession:
      type: apiKey
      in: cookie
      name: zusik_demo_session
  parameters:
    match:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: 'Silny walidator w formacie "<id>.<revision>". Oba pola pochodzą z tej samej odczytanej wersji profilu lub sprawy. Po kompresji odpowiedzi pośrednik może zwrócić słaby ETag. Klient odtwarza wówczas silny walidator z pól obiektu.'
    key:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Klucz jednej operacji, powtarzany bez zmian przy ponowieniu. Sesja może zapisać 120 nowych operacji na minutę. Ponowienie zapisanego wyniku nie zużywa limitu.
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    Problem:
      description: Błąd z kodem do obsługi przez klienta.
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
  schemas:
    FactField:
      type: string
      enum:
      - birthDate
      - insuranceTitle
      - employerRef
      - monthlyGrossPay
      - monthlyContributionBasis
      - submissionStatus
      - deliveryDate
      - benefitRequest
      - sicknessCoverage
      - otherCoverage
      - postInsuranceException
      - maternityPayVariant
      - payrollRegime
      - monthlyEmployeeDeduction
      - monthlyPayAfterDeduction
      - payerInsuredCount
      - accountArrears
      - sicknessCertificate
      - benefitHistory
      - birthChildCount
      - prenatalLeaveDays
      - maternityCourse
      - childDeathDate
      - debtSettlement
    Value:
      oneOf:
      - type: object
        additionalProperties: false
        properties:
          kind:
            const: date
          date:
            type: string
            format: date
        required:
        - kind
        - date
      - type: object
        additionalProperties: false
        properties:
          kind:
            const: money
          grosze:
            type: integer
            minimum: 0
          currency:
            const: PLN
        required:
        - kind
        - grosze
        - currency
      - type: object
        additionalProperties: false
        properties:
          kind:
            const: code
          code:
            type: string
            minLength: 1
            maxLength: 128
        required:
        - kind
        - code
      - type: object
        additionalProperties: false
        properties:
          kind:
            const: count
          count:
            type: integer
            minimum: 0
        required: [kind, count]
    Source:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - declaration
          - simulated_zus
          - document
          - workflow
        referenceId:
          type: string
          minLength: 1
          maxLength: 128
        page:
          type: integer
          minimum: 1
      required:
      - kind
      - referenceId
    FactInput:
      type: object
      additionalProperties: false
      properties:
        subjectId:
          type: string
          minLength: 1
          maxLength: 128
        field:
          "$ref": "#/components/schemas/FactField"
        value:
          "$ref": "#/components/schemas/Value"
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
          description: Ostatni dzień obowiązywania, włącznie.
        asOf:
          type: string
          format: date
        payerRef:
          type: string
          minLength: 1
          maxLength: 128
        titleRef:
          type: string
          minLength: 1
          maxLength: 128
        source:
          "$ref": "#/components/schemas/Source"
      required:
      - subjectId
      - field
      - value
      - source
      anyOf:
      - required:
        - validFrom
      - required:
        - asOf
      dependentRequired:
        validTo:
        - validFrom
      allOf:
      - if:
          properties:
            field:
              enum:
              - birthDate
              - deliveryDate
              - childDeathDate
          required:
          - field
        then:
          properties:
            value:
              properties:
                kind:
                  const: date
      - if:
          properties:
            field:
              enum:
              - monthlyGrossPay
              - monthlyContributionBasis
              - monthlyEmployeeDeduction
              - monthlyPayAfterDeduction
              - accountArrears
          required:
          - field
        then:
          properties:
            value:
              properties:
                kind:
                  const: money
      - if:
          properties:
            field:
              enum:
              - insuranceTitle
              - employerRef
              - submissionStatus
              - benefitRequest
              - sicknessCoverage
              - otherCoverage
              - postInsuranceException
              - maternityPayVariant
              - payrollRegime
              - benefitHistory
              - sicknessCertificate
              - maternityCourse
              - debtSettlement
          required:
          - field
        then:
          properties:
            value:
              properties:
                kind:
                  const: code
      - if:
          properties:
            field: {enum: [payerInsuredCount, birthChildCount, prenatalLeaveDays]}
        then:
          properties:
            value:
              properties:
                kind: {const: count}

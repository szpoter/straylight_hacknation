    MessageInput:
      type: object
      additionalProperties: false
      properties:
        intent:
          type: string
          enum:
          - link_account
          - read_account
          - public_question
          - read_context
          - declare_fact
          - ask_case
          - explain_result
          - hypothetical
        basisCaseRevision: {type: integer, minimum: 1}
        scenario: {type: string, enum: [employment-transition, business-settlement, unavailable]}
        from: {type: string, format: date}
        to: {type: string, format: date}
        areas:
          type: array
          minItems: 1
          maxItems: 5
          items: {type: string, enum: [insurance, contributions, e_zla, balance, benefits]}
        titleRef: {type: string, minLength: 1, maxLength: 128}
        payerRef: {type: string, minLength: 1, maxLength: 128}
        publicTopic:
          type: string
          enum: [nursery_recipient]
        publicQuestion:
          type: string
          minLength: 2
          maxLength: 500
        subjectId:
          type: string
          minLength: 1
          maxLength: 128
        topic:
          type: string
          minLength: 1
          maxLength: 128
        fact:
          "$ref": "#/components/schemas/FactInput"
        replyTo:
          type: string
          minLength: 1
          maxLength: 128
        assessmentId:
          type: string
          minLength: 1
          maxLength: 128
        basisProfileRevision:
          type: integer
          minimum: 1
          description: Wymagana do zapisu deklaracji w transakcji z turą. Zdezaktualizowana rewizja daje 409.
        validAt:
          type: string
          format: date
        knownAt:
          type: string
          format: date-time
        variant:
          type: array
          minItems: 1
          maxItems: 12
          items:
            "$ref": "#/components/schemas/FactInput"
      required:
      - intent
      allOf:
      - if:
          properties:
            intent:
              enum:
              - public_question
          required:
          - intent
        then:
          required:
          - publicQuestion
      - if:
          properties:
            intent:
              enum:
              - read_context
          required:
          - intent
        then:
          required:
          - topic
      - if:
          properties:
            intent:
              enum:
              - declare_fact
          required:
          - intent
        then:
          required:
          - fact
          - basisProfileRevision
      - if:
          properties:
            intent:
              enum:
              - explain_result
          required:
          - intent
        then:
          required:
          - assessmentId
      - if:
          properties:
            intent:
              enum:
              - hypothetical
          required:
          - intent
        then:
          required:
          - variant
      - if:
          properties:
            intent: {const: public_question}
        then:
          propertyNames:
            enum: [intent, replyTo, publicQuestion]
      - if:
          properties:
            intent: {const: read_context}
        then:
          propertyNames:
            enum: [intent, replyTo, topic, subjectId, validAt, knownAt, publicTopic]
      - if:
          properties:
            intent: {const: declare_fact}
        then:
          propertyNames:
            enum: [intent, replyTo, fact, basisProfileRevision]
      - if:
          properties:
            intent: {const: ask_case}
        then:
          propertyNames:
            enum: [intent, replyTo, topic, subjectId, validAt, knownAt]
      - if:
          properties:
            intent: {const: explain_result}
        then:
          propertyNames:
            enum: [intent, replyTo, assessmentId]
      - if:
          properties:
            intent: {const: hypothetical}
        then:
          propertyNames:
            enum: [intent, replyTo, variant, subjectId, validAt, knownAt]
      - if:
          properties:
            intent: {const: link_account}
        then:
          required: [subjectId, scenario, basisCaseRevision]
          propertyNames: {enum: [intent, subjectId, scenario, basisCaseRevision]}
      - if:
          properties:
            intent: {const: read_account}
        then:
          required: [subjectId, from, to, areas]
          propertyNames: {enum: [intent, subjectId, from, to, areas, titleRef, payerRef]}
      description: >-
        Jedna intencja na operację. Serwer akceptuje tylko pola mające znaczenie dla tej intencji i nigdy nie wykorzystuje parametrów
        wariantu do zmiany profilu.
    Citation:

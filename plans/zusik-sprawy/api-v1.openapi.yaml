          type: string
        publicQuery:
          type: string
          description: Publiczne zapytanie utworzone przez serwer do wznowienia tematu.
        opportunities:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, title, citationIds, missingFacts, exclusiveGroup]
            properties:
              id: {type: string}
              title: {type: string}
              citationIds: {type: array, minItems: 1, items: {type: string}}
              missingFacts: {type: array, items: {type: string}}
              exclusiveGroup: {type: [string, 'null']}
        citations:
          type: array
          items:
            "$ref": "#/components/schemas/Citation"
        proposalIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
        profileRevision:
          type: integer
          minimum: 1
        caseRevision:
          type: integer
          minimum: 1
        errorCode:
          type: string
          minLength: 1
          maxLength: 128
        account:
          type: object
          additionalProperties: false
          required: [sourceVersion, readAt, facts, coverage]
          properties:
            sourceVersion: {type: string}
            readAt: {type: string, format: date-time}
            facts:
              type: array
              items: {"$ref": "#/components/schemas/FactInput"}
            coverage:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [area, status, spans]
                properties:
                  area: {type: string, enum: [insurance, contributions, e_zla, balance, benefits]}
                  status: {type: string, enum: [no_register, unavailable, partial, unknown, complete]}
                  spans:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [from, to]
                      properties:
                        from: {type: string, format: date}
                        to: {type: string, format: date}
        input:
          "$ref": "#/components/schemas/MessageInput"
          description: Zweryfikowana, zminimalizowana postać tury użytkownika do wznowienia kontekstu.
      required:
      - id
      - state
      - citations
      - proposalIds
      - profileRevision
      - caseRevision
      - input
    AssessmentInput:
      type: object
      additionalProperties: false
      properties:
        subjectId:
          type: string
          minLength: 1
          maxLength: 128
        asOf:
          type: string
          format: date
        caseRevision:
          type: integer
          minimum: 1
        profileRevision:
          type: integer
          minimum: 1

    Decision:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - eligible
          - ineligible
          - needs_information
          - needs_review
          - unsupported
        benefit:
          type: string
          minLength: 1
          maxLength: 128
        subjectId:
          type: string
          minLength: 1
          maxLength: 128
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        titleRef: {type: string}
        payerRef: {type: string}
        payer: {type: string, enum: [zus, employer]}
        paymentStatus: {type: string, enum: [payable, withheld, needs_information, expired]}
        segments:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [from, to, days, ratePct, basisGrosze, dailyGrosze, grossAmountGrosze]
            properties:
              from: {type: string, format: date}
              to: {type: string, format: date}
              days: {type: integer, minimum: 1}
              ratePct: {type: number, minimum: 0}
              basisGrosze: {type: integer, minimum: 0}
              dailyGrosze: {type: integer, minimum: 0}
              grossAmountGrosze: {type: integer, minimum: 0}
        grossAmountGrosze:
          type: integer
          minimum: 0
        reasonCode:
          type: string
          minLength: 1
          maxLength: 128
        amountStatus:
          type: string
          enum:
          - calculated
          - needs_information
          - needs_review
          - not_applicable
          - unsupported
        amountPeriod:
          type: string
          enum:
          - total
          - daily
          - monthly
        citations:
          type: array
          items:
            "$ref": "#/components/schemas/Citation"
        needed:
          type: array
          items:
            "$ref": "#/components/schemas/MissingEvidence"
      required:
      - status
      - benefit
      - subjectId
      - reasonCode
      - amountStatus
      - citations
      allOf:
      - if:
          properties:
            amountStatus:
              enum:
              - calculated
          required:
          - amountStatus
        then:
          required:
          - grossAmountGrosze
          - amountPeriod
      - if:
          properties:
            amountStatus:
              enum:
              - needs_information
              - needs_review
              - not_applicable
              - unsupported
          required:
          - amountStatus
        then:
          not:
            required:
            - grossAmountGrosze
      - if:
          anyOf:
          - properties:
              status:
                const: needs_information
          - properties:
              amountStatus:
                const: needs_information
        then:
          required:
          - needed
          properties:
            needed:
              minItems: 1
